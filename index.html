<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>Batalha estilo FireRed</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{background:#1b1f2a;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:'Press Start 2P','Courier New',monospace}
#wrap{width:480px;height:320px;transform-origin:center}
#screen{position:relative;width:480px;height:320px;overflow:hidden;background:linear-gradient(#bfe3f2 0,#e8f6e0 46%,#9fd37a 46%,#78b85a 100%);border:4px solid #0d0f16;image-rendering:pixelated}
.plat{position:absolute;border-radius:50%;background:#6fae4f;box-shadow:inset 0 -6px 0 #5a9640}
#ep{left:272px;top:98px;width:180px;height:40px}
#pp{left:-10px;top:178px;width:230px;height:48px}
.spr{position:absolute;font-size:84px;line-height:1;text-align:center;transition:transform .5s,opacity .5s}
.spr img{width:100%;height:100%;image-rendering:pixelated}
#es{left:286px;top:0;width:128px;height:128px;font-size:100px}
#ps{left:56px;top:88px;width:128px;height:128px;font-size:100px}
#ps.emo{transform:scaleX(-1)}
#bg{position:absolute;left:0;top:0;width:480px;height:224px;background-size:1474px 932px;background-position:-498px -12px;image-rendering:pixelated}
.hit{animation:hit .4s steps(2) 3}
@keyframes hit{50%{opacity:0}}
.faint{transform:translateY(80px)!important;opacity:0}
#text{position:absolute;left:0;bottom:0;width:100%;height:96px;background:#38505c;border-top:4px solid #202c34;padding:6px}
#msg{height:100%;background:#f8f8f0;border:3px solid #c0382a;border-radius:6px;padding:12px 14px;font-size:11px;line-height:20px;color:#303030;width:100%}
#menu{position:absolute;right:6px;bottom:6px;width:236px;height:80px;background:#f8f8f0;border:3px solid #c0382a;border-radius:6px;display:none;grid-template-columns:1fr 1fr;align-content:center;padding:4px 8px}
#menu.moves{width:466px;grid-template-columns:1fr 1fr 150px}
#msg.narrow{width:calc(100% - 0px)}
button{font:inherit;font-size:10px;text-align:left;background:none;border:0;color:#303030;padding:6px 6px 6px 16px;cursor:pointer;position:relative}
button:hover::before,button:focus-visible::before{content:'▶';position:absolute;left:2px;font-size:8px;top:8px}
button:focus-visible{outline:none}
button:disabled{opacity:.4;cursor:default}
#title{position:absolute;inset:0;z-index:5;background:linear-gradient(#c0382a 0 50%,#f8f8f0 50% 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
#title h1{font-size:22px;line-height:30px;color:#fff;text-shadow:3px 3px 0 #202c34;margin-top:-30px}
#title h2{font-size:12px;color:#303030;margin-bottom:2px}
#title .big{font-size:14px;color:#303030;padding:10px 20px 10px 30px;animation:blink 1s steps(2) infinite}
#title .big::before{left:10px;top:11px;font-size:12px}
@keyframes blink{50%{opacity:.35}}
#list{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:432px;padding:0 4px}
#list button{display:flex;align-items:center;gap:10px;background:#f8f8f0;border:3px solid #3a4a5a;border-radius:6px;box-shadow:inset 0 0 0 2px #c9c9b8;padding:8px 8px 8px 22px;font-size:10px}
#list button::before{left:6px;top:20px}
#list button span.e{font-size:30px}
#list button small{display:block;font-size:7px;color:#707060;margin-top:6px}
@media (prefers-reduced-motion:reduce){#title .big{animation:none}}
#ps.faint{transform:translateY(80px)!important}
#ps.emo.faint{transform:scaleX(-1) translateY(80px)!important}
#list button:disabled{opacity:.45}
.box{position:absolute;background:#f8f8f0;border:3px solid #3a4a5a;border-radius:6px;color:#303030;font-size:8px}
#eb{left:16px;top:16px;width:200px;height:58px}
#pb{left:264px;top:148px;width:208px;height:74px}
.box .n,.box .lv{position:absolute;top:12px;font-size:8px;white-space:nowrap}
.box .n{left:12px}
#pb .n{left:28px;top:14px}
#eb .lv{left:166px}
#pb .lv{left:184px;top:14px}
.box .lv::before{content:'Lv'}
.box .bl{position:absolute;left:4px;top:-13px;color:#c0382a;font-size:8px;text-shadow:1px 1px 0 #fff}
#pb .bl{left:20px}
.trk{position:absolute;height:6px;top:34px;background:#505850;overflow:hidden}
#eb .trk{left:78px;width:96px}
#pb .trk{left:96px;width:94px}
.trk i{display:block;height:100%;width:100%;background:#40c060;transition:width .8s steps(24),background .3s}
.hn{position:absolute;right:14px;top:49px;font-size:8px}
#tr{left:56px;top:88px;width:128px;height:128px;z-index:2;font-size:0}
#fx{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:3}
.pop{animation:pop .4s steps(4)}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:none;opacity:1}}
.tb{display:inline-block;width:48px;height:24px;background:url(img/tipo_pokemom.png) 0 0/192px 144px;image-rendering:pixelated}
#info{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;font-size:9px;color:#303030}
#info span{position:absolute;display:block}
#icur{left:372px;top:29px;width:54px;text-align:right}
#imax{left:444px;top:29px}
#ity{left:382px;top:50px}
#info::before{content:"PP        /\ATYPE/";white-space:pre;position:absolute;left:334px;top:29px;font-size:8px;line-height:24px}
/* ---- visual original (quando img/battle_menu.png existe) ---- */
.ui .box{border:0;border-radius:0;background-color:transparent;background-image:var(--ui);background-repeat:no-repeat;background-size:1228px 592px;image-rendering:pixelated}
.ui #eb{background-position:-6px -6px}
.ui #pb{background-position:-6px -88px}
.ui .box .lv::before{content:none}
.ui #info::before{display:none}
.ui #text{background:var(--ui) -594px -112px/1228px 592px no-repeat;border:0;padding:0;image-rendering:pixelated}
.ui #msg{background:none;border:0;color:#fff;text-shadow:2px 2px 0 #6a6a6a;padding:20px 26px;line-height:22px}
.ui #menu{right:0;bottom:0;width:240px;height:96px;border:0;border-radius:0;padding:0;background:var(--ui) -292px -8px/1228px 592px no-repeat;image-rendering:pixelated}
.ui #menu.moves{width:480px;background-position:-594px -8px}
.ui #menu button{position:absolute;left:0;top:0;width:104px;height:28px;line-height:28px;padding:0;white-space:nowrap}
.ui #menu button:hover::before,.ui #menu button:focus-visible::before{content:'';font-size:0;top:50%;margin-top:-10px;left:-20px;width:12px;height:20px;background:var(--ui) -538px -8px/1228px 592px;image-rendering:pixelated}
.ui #menu [data-a=fight]{left:32px;top:21px;color:transparent}
.ui #menu [data-a=bag]{left:144px;top:21px;color:transparent}
.ui #menu [data-a=mon]{left:32px;top:51px;color:transparent}
.ui #menu [data-a=run]{left:144px;top:51px;color:transparent}
.ui #menu [data-a=again]{left:30px;top:34px;width:200px}
.ui #menu.moves button{width:140px}
.ui #menu.moves button:nth-child(1){left:38px;top:20px}
.ui #menu.moves button:nth-child(2){left:178px;top:20px}
.ui #menu.moves button:nth-child(3){left:38px;top:52px}
.ui #menu.moves button:nth-child(4){left:178px;top:52px}
.ui #menu.moves button[data-sw]{line-height:14px;height:auto}
.ui #menu.moves button[data-a=back]{left:338px;top:70px;width:110px;height:20px;line-height:20px;font-size:7px}
#screen:not(.ui) #menu [data-a=again]{grid-column:1/3}
#screen:not(.ui) #menu.moves [data-a=back]{grid-column:3;grid-row:1}
#screen:not(.ui) #menu.moves button:nth-child(1){grid-column:1;grid-row:1}
#screen:not(.ui) #menu.moves button:nth-child(2){grid-column:2;grid-row:1}
#screen:not(.ui) #menu.moves button:nth-child(3){grid-column:1;grid-row:2}
#screen:not(.ui) #menu.moves button:nth-child(4){grid-column:2;grid-row:2}
.ui #menu.team::after{content:'';position:absolute;left:324px;top:0;width:156px;height:96px;background:var(--ui) -290px -8px/599px 592px no-repeat;image-rendering:pixelated}
.ui #menu.team button{z-index:1}
</style>
</head>
<body>
<div id="wrap">
<div id="screen">
  <div id="bg"></div>
  <div class="plat" id="ep"></div><div class="plat" id="pp"></div>
  <div class="spr" id="es"></div><div class="spr" id="ps"></div>
  <div class="box" id="eb"><span class="n" id="en"></span><span class="lv" id="el"></span><span class="bl" id="eballs"></span><div class="trk"><i id="eh"></i></div></div>
  <div class="box" id="pb"><span class="n" id="pn"></span><span class="lv" id="pl"></span><span class="bl" id="pballs"></span><div class="trk"><i id="ph"></i></div><span class="hn" id="pnum"></span></div>
  <div class="spr" id="tr"></div><div id="fx"></div>
  <div id="text"><div id="msg"></div></div>
  <div id="menu"></div>
  <div id="title"></div>
</div>
</div>
<script>
/* Imagens (envie estes arquivos para a pasta img/ do repositório). Se faltar algum, o jogo usa o visual simples. */
const IMG = { sprites:'img/pokemons.png', bg:'img/base_de_pokemom.png', types:'img/tipo_pokemom.png', menu:'img/battle_menu.png', chars:'img/personagens.png', fx:'img/ataque_efeitos.png' };
const DEX = { charizard:6, blastoise:9, venusaur:3, pikachu:25 };   // número na Pokédex = posição na folha
const TYPE_POS = { normal:[0,0], flying:[2,0], poison:[3,0], fire:[2,2], water:[3,2], grass:[0,3], electric:[1,3], ice:[3,3] };
let typesOK = false;

const loadImg = src => { const im = new Image(); const ok = new Promise(r => { im.onload = () => r(true); im.onerror = () => r(false); }); im.src = src; return [im, ok]; };
const [sheet, sheetP] = loadImg(IMG.sprites), [charImg, charP] = loadImg(IMG.chars), [fxImg, fxP] = loadImg(IMG.fx), [menuImg, menuP] = loadImg(IMG.menu);
crop(menuImg, menuP, 0, 0, 614, 296, [255,255,255]).then(u => { if(u){ $('screen').style.setProperty('--ui', `url(${u})`); $('screen').classList.add('ui'); } });

/* recorta uma região da folha e apaga a cor de fundo (all=true apaga em toda a região; senão só o fundo ligado às bordas) */
async function crop(img, ready, x, y, w, h, bg, all){
  try{
    if(!(await ready)) return null;
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const cx = cv.getContext('2d'); cx.drawImage(img, x, y, w, h, 0, 0, w, h);
    const d = cx.getImageData(0, 0, w, h), p = d.data, c = bg || [p[0], p[1], p[2]];
    const same = i => p[i] === c[0] && p[i+1] === c[1] && p[i+2] === c[2];
    if(all){ for(let i = 0; i < p.length; i += 4) if(same(i)) p[i+3] = 0; }
    else{
      const seen = new Uint8Array(w * h), st = [];
      for(let k = 0; k < w; k++) st.push(k, (h - 1) * w + k);
      for(let k = 0; k < h; k++) st.push(k * w, k * w + w - 1);
      while(st.length){
        const q = st.pop(), i = q * 4;
        if(seen[q] || !same(i)) continue;
        seen[q] = 1; p[i+3] = 0;
        const X = q % w, Y = (q / w) | 0;
        if(X > 0) st.push(q - 1);
        if(X < w - 1) st.push(q + 1);
        if(Y > 0) st.push(q - w);
        if(Y < h - 1) st.push(q + w);
      }
    }
    cx.putImageData(d, 0, 0); return cv.toDataURL();
  }catch(e){ return null; }
}
const cache = {};
function spriteURL(key, back){
  const id = key + back; if(id in cache) return cache[id];
  const n = DEX[key] - 1, row = Math.floor(n / 15), col = n % 15;
  return cache[id] = crop(sheet, sheetP, 11 + 130 * col, 46 + 165 * row + (back ? 65 : 0), 64, 64);
}

/* efeitos de ataque: [x, y, largura, altura] na folha ataque_efeitos.png */
const FX = { fire:[7,218,28,30], water:[61,166,31,31], ice:[430,319,25,27], grass:[326,488,13,19], normal:[231,577,32,32], flying:[320,330,27,11], electric:[321,617,31,160] };
const fxCache = {};
const fxURL = t => fxCache[t] ??= crop(fxImg, fxP, ...FX[t], [34,177,76], true);
async function effect(type, side){
  if(!FX[type]) type = 'normal';
  const url = await fxURL(type); if(!url) return;
  const f = $('fx'), isP = side === 'p';
  const A = isP ? [130,150] : [350,70], T = isP ? [350,70] : [130,150];
  const sc = type === 'electric' ? 1.3 : type === 'flying' ? 3 : 2.2, w = FX[type][2] * sc, h = FX[type][3] * sc;
  const pos = (p, s = 1, r = 0) => `translate(${p[0] - w/2}px,${p[1] - h/2}px) scale(${s}) rotate(${r}deg)`;
  const mk = () => { const im = new Image(); im.src = url; im.style.cssText = `position:absolute;left:0;top:0;width:${w}px;height:${h}px;image-rendering:pixelated;opacity:0`; f.appendChild(im); return im; };
  const an = [];
  if(type === 'electric'){
    const P = [T[0], T[1] + 20];
    an.push(mk().animate([{transform:pos(P),opacity:0},{opacity:1,offset:.1},{opacity:.2,offset:.3},{opacity:1,offset:.5},{opacity:.2,offset:.7},{opacity:1,offset:.85},{transform:pos(P),opacity:0}], {duration:800, fill:'both'}));
  } else if(type === 'normal'){
    for(let i = 0; i < 3; i++){ const P = [T[0] + (i - 1) * 18, T[1] + (i % 2) * 14 - 7];
      an.push(mk().animate([{transform:pos(P,.3),opacity:1},{transform:pos(P,1.5,45),opacity:1,offset:.6},{transform:pos(P,1.8,90),opacity:0}], {duration:380, delay:i * 260, fill:'both'})); }
  } else {
    for(let i = 0; i < 5; i++){ const j = (i % 2 ? 12 : -12) + (i - 2) * 4;
      an.push(mk().animate([{transform:pos([A[0],A[1]+j],.6),opacity:1},{transform:pos([T[0],T[1]+j],1,type === 'grass' ? 360 : 0),opacity:1,offset:.8},{transform:pos([T[0],T[1]+j],1.6),opacity:0}], {duration:560, delay:i * 130, fill:'both', easing:'ease-in'})); }
  }
  await Promise.all(an.map(a => a.finished.catch(() => 0)));
  f.innerHTML = '';
}

/* treinador (costas) na introdução: frames 0..4 = parado + lançando a bola */
const trainerFrame = i => crop(charImg, charP, 8 + 65 * i, 225, 64, 64, [255,127,39]);
async function showTrainer(){
  const u = await trainerFrame(0); if(!u) return false;
  const t = $('tr'); t.style.transition = 'none'; t.style.opacity = 1; t.style.transform = 'none';
  t.innerHTML = `<img src="${u}" alt="">`; return true;
}
async function throwBall(){
  const t = $('tr'); if(!t.firstChild) return;
  for(let i = 1; i < 5; i++){ const u = await trainerFrame(i); if(u) t.firstChild.src = u; await sleep(120); }
  t.style.transition = 'transform .5s,opacity .5s'; t.style.transform = 'translateX(-220px)'; t.style.opacity = 0;
  await sleep(500); t.innerHTML = '';
}
const bgImg = new Image();
bgImg.onload = () => { $('bg').style.backgroundImage = `url(${IMG.bg})`; document.querySelectorAll('.plat').forEach(p => p.style.display = 'none'); };
bgImg.src = IMG.bg;
const tyImg = new Image(); tyImg.onload = () => typesOK = true; tyImg.src = IMG.types;

const CHART = {
  fire:{grass:2,ice:2,water:.5,fire:.5},
  water:{fire:2,water:.5,grass:.5},
  grass:{water:2,fire:.5,grass:.5,flying:.5},
  flying:{grass:2},
  ice:{grass:2,flying:2,water:.5,fire:.5,ice:.5},
  electric:{water:2,flying:2,grass:.5,electric:.5},
  poison:{grass:2,poison:.5},
  normal:{}
};
const mk = (name,types,emoji,s,moves)=>({name,types,emoji,lv:50,max:s.hp,hp:s.hp,...s,moves:moves.map(m=>({n:m[0],t:m[1],p:m[2],acc:m[3],sp:m[4],pp:m[5],max:m[5]}))});
const ROSTER = {
  charizard:['CHARIZARD',['fire','flying'],'🐲',{hp:153,atk:104,def:98,spa:129,spd:105,spe:120},
    [['FLAMETHROWER','fire',90,100,1,15],['FIRE BLAST','fire',110,85,1,5],['WING ATTACK','flying',60,100,0,35],['SLASH','normal',70,100,0,20]]],
  blastoise:['BLASTOISE',['water'],'🐢',{hp:154,atk:103,def:120,spa:105,spd:125,spe:98},
    [['HYDRO PUMP','water',110,80,1,5],['SURF','water',90,100,1,15],['ICE BEAM','ice',90,100,1,10],['BODY SLAM','normal',85,100,0,15]]],
  venusaur:['VENUSAUR',['grass','poison'],'🦖',{hp:155,atk:102,def:103,spa:120,spd:120,spe:100},
    [['SOLAR BEAM','grass',120,100,1,10],['RAZOR LEAF','grass',55,95,0,25],['SLUDGE BOMB','poison',90,100,1,10],['BODY SLAM','normal',85,100,0,15]]],
  pikachu:['PIKACHU',['electric'],'⚡',{hp:110,atk:75,def:60,spa:70,spd:70,spe:110},
    [['THUNDERBOLT','electric',90,100,1,15],['THUNDER','electric',110,70,1,10],['QUICK ATTACK','normal',40,100,0,30],['SLAM','normal',80,75,0,20]]]
};
const mkKey = k => ({...mk(...ROSTER[k]), key:k});
const newGame = picks => {
  const ks = Object.keys(ROSTER).sort(() => Math.random() - .5).slice(0, 2);
  const PT = picks.map(mkKey), ET = ks.map(mkKey);
  return { PT, ET, P: PT[0], E: ET[0] };
};

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
let G, busy = false, pickResolve = null, picks = [];

function fit(){ const s = Math.min(innerWidth/488, innerHeight/328, 3); $('wrap').style.transform = `scale(${s})`; }
addEventListener('resize', fit); fit();


function drawHP(p, bar, num){
  const pct = Math.max(0, p.hp / p.max * 100);
  bar.style.width = pct + '%';
  bar.style.background = pct > 50 ? '#40c060' : pct > 20 ? '#f0c020' : '#e04030';
  if(num) num.textContent = `${Math.max(0,p.hp)}/${p.max}`;
}

async function say(text, wait = 700){
  const m = $('msg'); m.textContent = '';
  for(const ch of text){ m.textContent += ch; await sleep(22); }
  await sleep(wait);
}

function show(html){ const mn = $('menu'); mn.innerHTML = html; mn.style.display = 'grid'; }
function hideMenu(){ $('menu').style.display = 'none'; $('menu').className = ''; }

function mainMenu(){
  busy = false;
  $('msg').textContent = `O que ${G.P.name} vai fazer?`;
  show(`<button data-a="fight">FIGHT</button><button data-a="bag">BAG</button><button data-a="mon">POKéMON</button><button data-a="run">RUN</button>`);
  $('menu').firstChild.focus();
}

function moveMenu(){
  const mn = $('menu'); mn.className = 'moves';
  mn.innerHTML = G.P.moves.map((m,i)=>`<button data-m="${i}" ${m.pp<=0?'disabled':''}>${m.n}</button>`).join('')
    + `<button data-a="back">VOLTAR</button><div id="info"><span id="icur"></span><span id="imax"></span><span id="ity"></span></div>`;
  mn.style.display = 'grid';
  // reorganiza: 4 golpes em 2x2 à esquerda
  [...mn.querySelectorAll('[data-m]')].forEach((b,i)=>{ b.onmouseenter = b.onfocus = () => {
    const m = G.P.moves[i]; $('icur').textContent = m.pp; $('imax').textContent = m.max; const tp = TYPE_POS[m.t];
    $('ity').innerHTML = typesOK && tp ? `<i class="tb" style="background-position:-${tp[0]*48}px -${tp[1]*24}px"></i>` : m.t.toUpperCase(); }; });
  $('msg').textContent = '';
  mn.querySelector('[data-m]:not(:disabled)')?.focus();
}

function calc(a, d, mv){
  const atk = mv.sp ? a.spa : a.atk, def = mv.sp ? d.spd : d.def;
  let dmg = Math.floor(Math.floor(Math.floor(2 * a.lv / 5 + 2) * mv.p * atk / def) / 50) + 2;
  let eff = 1; d.types.forEach(t => eff *= (CHART[mv.t][t] ?? 1));
  const crit = Math.random() < 1/16;
  if(a.types.includes(mv.t)) dmg *= 1.5;
  if(crit) dmg *= 1.5;
  dmg = Math.max(1, Math.floor(dmg * eff * (0.85 + Math.random() * 0.15)));
  return {dmg, eff, crit};
}

async function attack(att, def, mv, side){
  const isP = side === 'p';
  await say(`${isP ? '' : 'O inimigo '}${att.name} usou ${mv.n}!`, 400);
  if(isP) mv.pp--;
  if(Math.random() * 100 >= mv.acc){ await say(`O ataque de ${att.name} errou!`); return; }
  const {dmg, eff, crit} = calc(att, def, mv);
  await effect(mv.t, side);
  const tgt = $(isP ? 'es' : 'ps');
  tgt.classList.add('hit'); await sleep(1200); tgt.classList.remove('hit');
  def.hp -= dmg;
  drawHP(def, $(isP ? 'eh' : 'ph'), isP ? null : $('pnum'));
  await sleep(900);
  if(crit) await say('Foi um golpe crítico!', 500);
  if(eff > 1) await say('É super efetivo!', 500);
  else if(eff < 1) await say('Não foi muito efetivo...', 500);
}

function load(side){
  const isP = side === 'p', m = isP ? G.P : G.E, el = $(isP ? 'ps' : 'es');
  el.classList.remove('faint','hit'); el.style.opacity = ''; el.style.visibility = '';
  el.classList.add('emo'); el.textContent = m.emoji;      // emoji até a imagem carregar
  spriteURL(m.key, isP).then(u => { if(u && (isP ? G.P : G.E) === m){ el.classList.remove('emo'); el.innerHTML = `<img src="${u}" alt="">`; } });
  $(isP ? 'pn' : 'en').textContent = m.name; $(isP ? 'pl' : 'el').textContent = m.lv;
  drawHP(m, $(isP ? 'ph' : 'eh'), isP ? $('pnum') : null);
  balls();
}
function balls(){
  $('pballs').textContent = G.PT.map(p => p.hp > 0 ? '●' : '○').join(' ');
  $('eballs').textContent = G.ET.map(p => p.hp > 0 ? '●' : '○').join(' ');
}

async function switchIn(side, idx){
  const isP = side === 'p', out = isP ? G.P : G.E;
  if(out.hp > 0){
    await say(isP ? `Volte, ${out.name}!` : `Rival retirou ${out.name}!`, 300);
    $(isP ? 'ps' : 'es').style.opacity = 0; await sleep(500);
  }
  if(isP) G.P = G.PT[idx]; else G.E = G.ET[idx];
  load(side);
  { const el = $(isP ? 'ps' : 'es'); el.classList.add('pop'); setTimeout(() => el.classList.remove('pop'), 500); }
  await say(isP ? `Vai, ${G.P.name}!` : `Rival enviou ${G.E.name}!`, 700);
}

function end(){
  busy = false;
  show(`<button data-a="again">JOGAR DE NOVO</button>`);
  $('menu').firstChild.focus();
  return true;
}

async function faint(side){
  const f = side === 'e' ? G.E : G.P;
  $(side === 'e' ? 'es' : 'ps').classList.add('faint');
  await sleep(700); balls();
  await say(`${side === 'e' ? 'O inimigo ' : ''}${f.name} desmaiou!`, 900);
}

/* devolve true se a batalha acabou */
async function afterFaint(side){
  await faint(side);
  if(side === 'e'){
    const nx = G.ET.findIndex(p => p.hp > 0);
    if(nx < 0){ await say('Você venceu a batalha!', 600); return end(); }
    await switchIn('e', nx); return false;
  }
  if(!G.PT.some(p => p.hp > 0)){ await say('Você não tem mais Pokémon... Você desmaiou!', 600); return end(); }
  const idx = await new Promise(r => { pickResolve = r; teamMenu(true); });
  await switchIn('p', idx); return false;
}

function teamMenu(forced){
  const mn = $('menu'); mn.className = 'moves team';
  mn.innerHTML = G.PT.map((p,i) => `<button data-sw="${i}" ${p.hp <= 0 || p === G.P ? 'disabled' : ''}>${p.name}<small style="display:block;font-size:7px;margin-top:6px">HP ${Math.max(0,p.hp)}/${p.max}${p === G.P ? ' · EM CAMPO' : p.hp <= 0 ? ' · DESMAIADO' : ''}</small></button>`).join('')
    + (forced ? '' : `<button data-a="back">VOLTAR</button>`);
  mn.style.display = 'grid';
  $('msg').textContent = forced ? 'Escolha o próximo Pokémon!' : 'Trocar para qual Pokémon?';
  mn.querySelector('button:not(:disabled)')?.focus();
}

async function turn(act){
  busy = true; hideMenu();
  const ok = G.E.moves.filter(m => m.pp > 0);
  const em = ok[Math.floor(Math.random() * ok.length)] || G.E.moves[0];
  if(act.sw !== undefined){
    await switchIn('p', act.sw);
    await attack(G.E, G.P, em, 'e');
    if(G.P.hp <= 0 && await afterFaint('p')) return;
    return mainMenu();
  }
  const pm = G.P.moves[act.m];
  const order = G.P.spe >= G.E.spe ? [['p',pm],['e',em]] : [['e',em],['p',pm]];
  for(const [side, mv] of order){
    const att = side === 'p' ? G.P : G.E, def = side === 'p' ? G.E : G.P;
    await attack(att, def, mv, side);
    if(def.hp <= 0){ if(await afterFaint(side === 'p' ? 'e' : 'p')) return; break; }
  }
  mainMenu();
}

$('menu').addEventListener('click', async e => {
  const b = e.target.closest('button'); if(!b || b.disabled) return;
  if(b.dataset.sw !== undefined){
    const i = +b.dataset.sw;
    if(pickResolve){ const r = pickResolve; pickResolve = null; hideMenu(); return r(i); }
    if(busy) return; return turn({sw:i});
  }
  if(busy) return;
  if(b.dataset.m !== undefined) return turn({m:+b.dataset.m});
  const a = b.dataset.a;
  if(a === 'fight') moveMenu();
  else if(a === 'mon') teamMenu(false);
  else if(a === 'back') { hideMenu(); mainMenu(); }
  else if(a === 'again') { hideMenu(); picks = []; showTitle(true); }
  else { busy = true; hideMenu();
    await say(a === 'run' ? 'Não dá para fugir de uma batalha de treinador!' : 'Você não tem itens na mochila.', 900);
    mainMenu(); }
});

addEventListener('keydown', e => {
  const bs = [...document.querySelectorAll($('title').style.display === 'flex' ? '#list button:not(:disabled)' : '#menu button:not(:disabled)')]; if(!bs.length) return;
  const i = bs.indexOf(document.activeElement);
  if(['ArrowRight','ArrowDown'].includes(e.key)){ bs[(i+1)%bs.length].focus(); e.preventDefault(); }
  if(['ArrowLeft','ArrowUp'].includes(e.key)){ bs[(i-1+bs.length)%bs.length].focus(); e.preventDefault(); }
  if(e.key === 'x' || e.key === 'Escape') bs.find(b => b.dataset.a === 'back')?.click();
});

async function start(team){
  busy = true; hideMenu(); $('title').style.display = 'none'; G = newGame(team);
  load('e'); load('p');
  const tr = await showTrainer();
  if(tr) $('ps').style.visibility = 'hidden';
  await say('O treinador rival quer batalhar!', 800);
  await say(`Rival enviou ${G.E.name}!`, 600);
  await say(`Vai, ${G.P.name}!`, 300);
  if(tr){ await throwBall(); const ps = $('ps'); ps.style.visibility = ''; ps.classList.add('pop'); setTimeout(() => ps.classList.remove('pop'), 500); }
  await sleep(500);
  mainMenu();
}

const TN = {fire:'FOGO',water:'ÁGUA',grass:'PLANTA',flying:'VOADOR',electric:'ELÉTRICO',poison:'VENENO',ice:'GELO',normal:'NORMAL'};
function showTitle(pick){
  busy = true; hideMenu(); const t = $('title'); t.style.display = 'flex'; $('msg').textContent = '';
  if(!pick) picks = [];
  t.innerHTML = pick
    ? `<h2>ESCOLHA O ${picks.length + 1}º POKéMON (${picks.length}/2)</h2><div id="list">${Object.entries(ROSTER).map(([k,r]) =>
        `<button data-pick="${k}" ${picks.includes(k) ? 'disabled' : ''}><span class="e">${r[2]}</span><span>${r[0]}<small>${r[1].map(x => TN[x]).join(' / ')} · HP ${r[3].hp}</small></span></button>`).join('')}</div>`
    : `<h1>POKéMON<br>BATTLE</h1><button class="big" data-go>START</button>`;
  t.querySelector('button:not(:disabled)').focus();
}
$('title').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b || b.disabled) return;
  if(b.dataset.go !== undefined) showTitle(true);
  else if(b.dataset.pick){ picks.push(b.dataset.pick); picks.length < 2 ? showTitle(true) : start(picks.slice()); }
});
showTitle(false);
</script>
</body>
