<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light only">
<meta name="darkreader-lock">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Batalha estilo FireRed</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#1b1f2a;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:'Press Start 2P','Courier New',monospace;-webkit-user-select:none;user-select:none}
#wrap{width:480px;height:320px;flex:none;transform-origin:center}
#screen{position:relative;width:480px;height:320px;overflow:hidden;background:#000;image-rendering:pixelated}
#screen *{image-rendering:pixelated}

/* ---------- campo de batalha ---------- */
#bg{position:absolute;left:0;top:0;width:480px;height:224px;z-index:0;background:#bfe3f2 url(img/base_de_pokemom.png) -498px -12px/1474px 932px no-repeat}
.base{position:absolute;z-index:0;display:none;background-repeat:no-repeat;background-size:100% 100%}
#be{left:224px;top:92px;width:256px;height:68px}
#bp{left:-8px;top:146px;width:256px;height:68px}
#screen.battle .base.on{display:block}
.spr{position:absolute;width:128px;height:128px;transition:transform .5s,opacity .5s}
.spr img{width:100%;height:100%;display:block}
#es{left:300px;top:14px}
#ps{left:56px;top:72px}
#tr{left:56px;top:72px;z-index:2}
.hit{animation:hit .4s steps(2) 3}
@keyframes hit{50%{opacity:0}}
.faint{transform:translateY(80px)!important;opacity:0}
.pop{animation:pop .4s steps(4)}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:none;opacity:1}}
#fx{position:absolute;left:0;top:0;width:480px;height:224px;overflow:hidden;pointer-events:none;z-index:3}
#screen:not(.battle) .spr,#screen:not(.battle) .box,#screen:not(.battle) .balls{display:none}

/* ---------- caixas de HP (battle_menu.png, 2x) ---------- */
.box{position:absolute;background:url(img/battle_menu.png) no-repeat;background-size:1228px 592px;color:#404040;text-shadow:1px 1px 0 #d8d0b0;white-space:nowrap}
#eb{left:16px;top:16px;width:200px;height:58px;background-position:-6px -6px}
#pb{left:264px;top:148px;width:208px;height:74px;background-position:-6px -88px}
.box .n{position:absolute;font-size:10px;top:11px}
.box .lv{position:absolute;font-size:9px;top:12px}
#eb .n{left:14px} #eb .lv{left:166px}
#pb .n{left:26px} #pb .lv{left:183px}
.trk{position:absolute;height:6px;background:#506058;overflow:hidden}
#eb .trk{left:78px;top:34px;width:96px}
#pb .trk{left:96px;top:34px;width:96px}
.trk i{display:block;height:100%;width:100%;transition:width .8s steps(24)}
.hp-g{background:linear-gradient(#58d080 0 2px,#70f8a8 2px)}
.hp-y{background:linear-gradient(#c8a808 0 2px,#f8e038 2px)}
.hp-r{background:linear-gradient(#a84048 0 2px,#f85838 2px)}
.hn{position:absolute;right:16px;top:45px;font-size:9px}
.balls{position:absolute;display:flex;gap:2px;z-index:1}
.balls b{display:block;width:14px;height:14px;background:url(img/battle_menu.png) no-repeat;background-size:1228px 592px}
.balls b.ok{background-position:-266px -130px}
.balls b.ko{background-position:-286px -130px}
#eballs{left:20px;top:2px}
#pballs{left:266px;top:134px}

/* ---------- texto + menus (battle_menu.png, 2x) ---------- */
#text{position:absolute;left:0;top:224px;width:480px;height:96px;background:url(img/battle_menu.png) -594px -112px/1228px 592px no-repeat}
#msg{position:absolute;left:24px;top:22px;width:420px;color:#f8f8f8;text-shadow:2px 2px 0 #6a6a6a;font-size:12px;line-height:28px}
#menu{position:absolute;right:0;top:224px;width:240px;height:96px;display:none;background:url(img/battle_menu.png) -292px -8px/1228px 592px no-repeat}
#menu.moves{width:480px;background-position:-594px -8px}
#menu.plain{width:480px;background:none;pointer-events:none}
#menu.plain button{pointer-events:auto}
#menu button{font:inherit;background:none;border:0;color:#404040;text-align:left;cursor:pointer;position:absolute;white-space:nowrap;text-shadow:1px 1px 0 #d8d0b0}
#menu button:focus{outline:none}
#menu button:hover::before,#menu button:focus-visible::before,#menu button:focus::before{content:'';position:absolute;left:-18px;top:50%;margin-top:-10px;width:12px;height:20px;background:url(img/battle_menu.png) -538px -8px/1228px 592px no-repeat}
#menu button:disabled{opacity:.45;cursor:default}
#menu button:disabled::before{display:none}
/* menu principal: o texto FIGHT/BAG/POKéMON/RUN já está desenhado na imagem */
#menu [data-a=fight],#menu [data-a=bag],#menu [data-a=mon],#menu [data-a=run]{width:100px;height:28px;color:transparent;text-shadow:none}
#menu [data-a=fight]{left:30px;top:20px} #menu [data-a=bag]{left:142px;top:20px}
#menu [data-a=mon]{left:30px;top:52px}   #menu [data-a=run]{left:142px;top:52px}
#menu [data-a=again]{left:40px;top:54px;font-size:10px;width:230px;height:28px;color:#f8f8f8;text-shadow:2px 2px 0 #6a6a6a}
/* menu de golpes */
#menu.moves [data-m]{width:150px;height:28px;font-size:11px}
#menu.moves [data-m="0"]{left:38px;top:16px} #menu.moves [data-m="1"]{left:188px;top:16px}
#menu.moves [data-m="2"]{left:38px;top:50px} #menu.moves [data-m="3"]{left:188px;top:50px}
#menu .chip{right:6px;left:auto;top:-214px;font-size:8px;color:#f8f8f8;background:#283030;border:2px solid #a0a0b8;padding:5px 8px;z-index:4;text-shadow:none}
#menu .chip::before{display:none!important}
#info span{position:absolute;display:block;font-size:10px;color:#404040;text-shadow:1px 1px 0 #d8d0b0}
#icur{left:368px;top:30px;width:46px;text-align:right}
#imax{left:440px;top:30px;width:30px}
#ity{left:392px;top:52px;height:24px}
.tb{display:inline-block;width:48px;height:24px;background:url(img/tipo_pokemom.png) 0 0/192px 144px no-repeat}

/* ---------- cenas iniciais (cenas_iniciais.png, 2x) ---------- */
#scene{position:absolute;inset:0;z-index:20;background-color:#000;background-repeat:no-repeat;display:none}
#scene.on{display:block}
#scene .blink{display:none;position:absolute;left:84px;top:252px;width:180px;height:24px;background:#000;animation:blink 1s steps(1) infinite}
#scene.title .blink{display:block}
@keyframes blink{0%,60%{opacity:0}61%,100%{opacity:1}}
#scene button{position:absolute;inset:0;width:100%;height:100%;background:none;border:0;cursor:pointer;opacity:0}
#fade{position:absolute;inset:0;z-index:30;background:#000;opacity:0;pointer-events:none;transition:opacity .35s}
#fade.on{opacity:1}

/* ---------- escolha / troca de Pokémon ---------- */
#pick{position:absolute;left:0;top:0;width:480px;height:224px;z-index:6;display:none;grid-template-columns:1fr 1fr;grid-auto-rows:100px;align-content:start;gap:8px;padding:8px}
#screen.picking .spr,#screen.picking .box,#screen.picking .balls,#screen.picking #fx{visibility:hidden}
#pick.on{display:grid}
#pick.grid{grid-template-columns:repeat(4,1fr);grid-auto-rows:108px;gap:6px;padding:8px;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:#c8a840 #283030}
.card.sm{flex-direction:column;justify-content:center;gap:2px;padding:0;border-width:8px;border-image:var(--card) 7 fill/8px stretch;text-align:center}
.card.sm .im{margin:0}
.card.sm .tx{align-items:center;gap:3px;font-size:7px}
.card.sm .tx small{display:none}
#pick.team{grid-template-columns:repeat(3,1fr);grid-auto-rows:100px;gap:6px;padding:8px;overflow-y:auto;scrollbar-width:thin}
#pick.team .card.sm .im,#pick.team .card.sm .im img{width:48px;height:48px}
#pick.team .card.sm .ty{display:none}
#pick.team .card.sm .tx small{display:block;font-size:6px}
.card.sm:hover::before,.card.sm:focus::before{left:-3px;margin-top:-20px}
.card{position:relative;font:inherit;color:#404040;text-align:left;cursor:pointer;display:flex;align-items:center;gap:6px;padding:0 6px 0 22px;border:14px solid transparent;border-image:var(--card) 7 fill/14px stretch;background:none;text-shadow:1px 1px 0 #d8d0b0;min-width:0}
.card:focus{outline:none}
.card:hover::before,.card:focus::before{content:'';position:absolute;left:-10px;top:50%;margin-top:-10px;width:12px;height:20px;background:url(img/battle_menu.png) -538px -8px/1228px 592px no-repeat}
.card:disabled{opacity:.5;cursor:default}
.card:disabled::before{display:none}
.card .im{width:64px;height:64px;flex:none;margin-left:-6px}
.card .im img{width:64px;height:64px;display:block}
.card .tx{display:flex;flex-direction:column;gap:5px;font-size:9px;min-width:0}
.card .tx small{font-size:7px;color:#605848}
.card .ty{display:flex;gap:2px}
.card .tb{width:32px;height:16px;background-size:128px 96px}
#msg small{font-size:9px}

/* ---------- mochila (BAG) ---------- */
#pick.bag{padding-top:40px;grid-auto-rows:88px}
.card.item .im,.card.item .im img{width:48px;height:48px;margin:0}
.card.item .tx small{display:block;font-size:7px;color:#605848}
#menu .tabs{position:absolute;left:8px;top:-216px;display:flex;gap:6px;z-index:8;pointer-events:auto}
#menu .tabs button{position:relative;font-size:8px;padding:6px 9px;background:#283030;color:#f8f8f8;border:2px solid #a0a0b8;text-shadow:none}
#menu .tabs button.on{background:#c8a840;color:#202020;border-color:#f8f8f8}
#menu .tabs button::before{display:none!important}
#screen.picking #menu .chip{z-index:8}
#menu.moves [data-pp]{width:150px;height:28px;font-size:11px}
#menu.moves [data-pp="0"]{left:38px;top:16px} #menu.moves [data-pp="1"]{left:188px;top:16px}
#menu.moves [data-pp="2"]{left:38px;top:50px} #menu.moves [data-pp="3"]{left:188px;top:50px}

@media (prefers-reduced-motion:reduce){#scene .blink{animation:none}}

/* ---------- status (ícones de tipo_pokemom.png) e info dos golpes ---------- */
.st{position:absolute;display:none;height:12px;background:url(img/tipo_pokemom.png) no-repeat;background-size:192px 144px;image-rendering:pixelated}
#eb .st{left:12px;top:33px} #pb .st{left:26px;top:33px}
#fxi{position:absolute;left:6px;bottom:98px;max-width:252px;font-size:7px;line-height:11px;color:#f8f8f8;background:#283030;border:2px solid #a0a0b8;padding:4px 6px;pointer-events:none;z-index:4}
.sfx{position:absolute;inset:0;pointer-events:none;-webkit-mask:var(--m) center/100% 100% no-repeat;mask:var(--m) center/100% 100% no-repeat;background:var(--p) 0 0/96px 96px;opacity:.9}
.sfx.up{animation:sfxup 1.2s steps(12) 1}.sfx.down{animation:sfxdn 1.2s steps(12) 1}
@keyframes sfxup{from{background-position:0 0}to{background-position:0 -192px}}
@keyframes sfxdn{from{background-position:0 -192px}to{background-position:0 0}}
.buff{animation:buff .8s steps(4)}.debuff{animation:debuff .8s steps(4)}
@keyframes buff{50%{filter:brightness(2.2) saturate(1.8)}}
@keyframes debuff{50%{filter:brightness(.35)}}
#dexbtn{position:absolute;right:10px;bottom:98px;z-index:9;display:none;font:8px 'Press Start 2P',monospace;padding:6px 8px;background:#c8a840;color:#202020;border:2px solid #f8f8f8;cursor:pointer}
#screen.battle #dexbtn{top:6px;bottom:auto;right:6px;padding:4px 6px;font-size:7px}
#dex{position:absolute;inset:0;z-index:40;display:none;background:#203840;color:#f8f8f8;font-size:8px;overflow:hidden}
#dex.on{display:block}
#dex .hd{height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:#c8a840;color:#202020}
#dex button{font:8px 'Press Start 2P',monospace;background:#283030;color:#f8f8f8;border:2px solid #a0a0b8;padding:4px 6px;cursor:pointer}
#dex .lst{height:294px;overflow-y:auto;display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:6px;scrollbar-width:thin}
#dex .lst button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 0;background:#f0f0e8;color:#303030;border-color:#585868;font-size:6px}
#dex .lst img{width:48px;height:48px}.dex-no{filter:brightness(0) opacity(.55)}
#dex .own::after{content:'●';color:#e04030;font-size:6px}
#dex .dt{display:none;padding:8px 12px;gap:12px}#dex.det .dt{display:flex}#dex.det .lst{display:none}
#dex .dt img{width:128px;height:128px;background:#f0f0e8;border:3px solid #a0a0b8}
#dex .bar{height:6px;background:#506058;margin:3px 0 6px}#dex .bar i{display:block;height:6px;background:#58d878}
#dex .mv{display:flex;align-items:center;gap:6px;margin:3px 0;font-size:7px}
</style>
</head>
<body>
<div id="wrap">
<div id="screen">
  <div id="bg"></div>
  <div class="base" id="be"></div><div class="base" id="bp"></div>
  <div class="spr" id="es"></div><div class="spr" id="ps"></div><div class="spr" id="tr"></div>
  <div id="fx"></div>
  <div class="balls" id="eballs"></div><div class="balls" id="pballs"></div>
  <div class="box" id="eb"><span class="n" id="en"></span><span class="lv" id="el"></span><div class="trk"><i id="eh" class="hp-g"></i></div><i class="st" id="est"></i></div>
  <div class="box" id="pb"><span class="n" id="pn"></span><span class="lv" id="pl"></span><div class="trk"><i id="ph" class="hp-g"></i></div><span class="hn" id="pnum"></span><i class="st" id="pst"></i></div>
  <div id="pick"></div>
  <button id="dexbtn" type="button">POKéDEX</button><div id="dex"></div>
  <div id="text"><div id="msg"></div></div>
  <div id="menu"></div>
  <div id="scene"><div class="blink"></div><button id="sceneBtn" aria-label="Continuar"></button></div>
  <div id="fade"></div>
</div>
</div>
<script>
/* ============ arquivos (pasta img/) ============ */
const IMG = {
  sprites:'img/pokemons.png', bg:'img/base_de_pokemom.png', types:'img/tipo_pokemom.png',
  ui:'img/battle_menu.png', scenes:'img/cenas_iniciais.png', chars:'img/personagens.png', fx:'img/ataque_efeitos.png', items:'img/itens.png', fxs:'img/efeitos_status.png'
};
const DEX = {};   // nº da Pokédex de cada Pokémon = posição na folha (15 por linha); preenchido a partir de POKE
/* posição [coluna, linha] de cada tipo na folha tipo_pokemom.png (ícones de 32x16) */
const TYPE_POS = { normal:[0,0], fighting:[1,0], flying:[2,0], poison:[3,0], ground:[0,1], rock:[1,1], bug:[2,1], ghost:[3,1],
                   steel:[0,2], fire:[2,2], water:[3,2], grass:[0,3], electric:[1,3], psychic:[2,3], ice:[3,3], dragon:[0,4], dark:[1,4] };
const TN = {normal:'NORMAL',fighting:'LUTADOR',flying:'VOADOR',poison:'VENENO',ground:'TERRA',rock:'PEDRA',bug:'INSETO',ghost:'FANTASMA',fire:'FOGO',water:'ÁGUA',grass:'PLANTA',electric:'ELÉTRICO',psychic:'PSÍQUICO',ice:'GELO',dragon:'DRAGÃO'};

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const IM = {};            // imagens carregadas
const missing = [];

function loadAll(){
  return Promise.all(Object.entries(IMG).map(([k, src]) => new Promise(res => {
    const im = new Image(); im.onload = () => { IM[k] = im; res(); };
    im.onerror = () => { missing.push(src); res(); }; im.src = src;
  })));
}

/* recorta uma região da folha; apaga a cor de fundo (all=true: em toda a região; senão só o fundo ligado às bordas) */
const cropCache = {};
function crop(key, x, y, w, h, bg, all){
  const id = [key,x,y,w,h].join(','); if(id in cropCache) return cropCache[id];
  const img = IM[key]; if(!img) return null;
  try{
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const cx = cv.getContext('2d'); cx.drawImage(img, x, y, w, h, 0, 0, w, h);
    const d = cx.getImageData(0, 0, w, h), p = d.data, c = bg || [p[0], p[1], p[2]];
    const same = i => p[i] === c[0] && p[i+1] === c[1] && p[i+2] === c[2];
    if(all){ for(let i = 0; i < p.length; i += 4) if(same(i)) p[i+3] = 0; }
    else{
      const seen = new Uint8Array(w * h), st = [];
      for(let k = 0; k < w; k++) st.push(k, (h - 1) * w + k);
      for(let k = 0; k < h; k++) st.push(k * w, k * w + w - 1);
      while(st.length){
        const q = st.pop(), i = q * 4;
        if(seen[q] || !same(i)) continue;
        seen[q] = 1; p[i+3] = 0;
        const X = q % w, Y = (q / w) | 0;
        if(X > 0) st.push(q - 1); if(X < w - 1) st.push(q + 1);
        if(Y > 0) st.push(q - w); if(Y < h - 1) st.push(q + w);
      }
    }
    cx.putImageData(d, 0, 0); return cropCache[id] = cv.toDataURL();
  }catch(e){ return null; }
}
const spriteURL = (key, back, shiny) => { const n = DEX[key] - 1, r = Math.floor(n / 15), c = n % 15;
  return crop('sprites', 11 + 130 * c + (shiny ? 65 : 0), 46 + 165 * r + (back ? 65 : 0), 64, 64); };
const trainerFrame = i => crop('chars', 8 + 65 * i, 225, 64, 64, [255,127,39]);

/* ============ efeitos de ataque: [x, y, largura, altura] em ataque_efeitos.png ============ */
const FX = { fire:[7,218,28,30], water:[61,166,31,31], ice:[430,319,25,27], grass:[326,488,13,19], normal:[231,577,32,32], flying:[320,330,27,11], electric:[321,617,31,160],
  fighting:[541,366,26,26], ghost:[696,236,16,26], rock:[471,543,30,24], ground:[800,103,22,22], poison:[381,470,16,16], psychic:[314,436,38,38], bug:[425,171,16,18], dragon:[7,218,28,30] };
const fxURL = t => crop('fx', ...FX[t], [34,177,76], true);
async function effect(type, side){
  if(!FX[type]) type = 'normal';
  const url = fxURL(type); if(!url) return;
  const f = $('fx'), isP = side === 'p';
  const A = isP ? [130,150] : [350,70], T = isP ? [350,70] : [130,150];
  const sc = type === 'electric' ? 1.3 : type === 'flying' ? 3 : type === 'rock' ? 2.6 : type === 'psychic' ? 1.8 : 2.2, w = FX[type][2] * sc, h = FX[type][3] * sc;
  const pos = (p, s = 1, r = 0) => `translate(${p[0] - w/2}px,${p[1] - h/2}px) scale(${s}) rotate(${r}deg)`;
  const mkImg = () => { const im = new Image(); im.src = url; im.style.cssText = `position:absolute;left:0;top:0;width:${w}px;height:${h}px;opacity:0` + (type === 'dragon' ? ';filter:hue-rotate(190deg) saturate(1.5)' : ''); f.appendChild(im); return im; };
  const an = [];
  if(type === 'electric'){
    const P = [T[0], T[1] + 20];
    an.push(mkImg().animate([{transform:pos(P),opacity:0},{opacity:1,offset:.1},{opacity:.2,offset:.3},{opacity:1,offset:.5},{opacity:.2,offset:.7},{opacity:1,offset:.85},{transform:pos(P),opacity:0}], {duration:800, fill:'both'}));
  } else if(type === 'rock' || type === 'ground'){   // caem do alto sobre o alvo
    for(let i = 0; i < 4; i++){ const X = T[0] + (i - 1.5) * 26, Y = T[1] + (i % 2) * 10;
      an.push(mkImg().animate([{transform:pos([X, Y - 140]),opacity:1},{transform:pos([X, Y]),opacity:1,offset:.7},{transform:pos([X, Y],1.4),opacity:0}], {duration:520, delay:i * 200, fill:'both'})); }
  } else if(type === 'normal' || type === 'fighting' || type === 'psychic'){   // aparecem em cima do alvo
    for(let i = 0; i < 3; i++){ const P = [T[0] + (i - 1) * 18, T[1] + (i % 2) * 14 - 7];
      an.push(mkImg().animate([{transform:pos(P,.3),opacity:1},{transform:pos(P,1.5,45),opacity:1,offset:.6},{transform:pos(P,1.8,90),opacity:0}], {duration:380, delay:i * 260, fill:'both'})); }
  } else {
    for(let i = 0; i < 5; i++){ const j = (i % 2 ? 12 : -12) + (i - 2) * 4;
      an.push(mkImg().animate([{transform:pos([A[0],A[1]+j],.6),opacity:1},{transform:pos([T[0],T[1]+j],1,type === 'grass' ? 360 : 0),opacity:1,offset:.8},{transform:pos([T[0],T[1]+j],1.6),opacity:0}], {duration:560, delay:i * 130, fill:'both', easing:'ease-in'})); }
  }
  await Promise.all(an.map(a => a.finished.catch(() => 0)));
  f.innerHTML = '';
}

/* treinador (costas): frames 0..4 = parado + lançando a bola */
function showTrainer(){
  const u = trainerFrame(0); if(!u) return false;
  const t = $('tr'); t.style.transition = 'none'; t.style.opacity = 1; t.style.transform = 'none';
  t.innerHTML = `<img src="${u}" alt="">`; return true;
}
async function throwBall(){
  const t = $('tr'); if(!t.firstChild) return;
  for(let i = 1; i < 5; i++){ const u = trainerFrame(i); if(u) t.firstChild.src = u; await sleep(120); }
  t.style.transition = 'transform .5s,opacity .5s'; t.style.transform = 'translateX(-220px)'; t.style.opacity = 0;
  await sleep(500); t.innerHTML = '';
}

const newGame = picks => {
  // o rival nunca usa um Pokémon que esteja na equipe do jogador
  const ks = Object.keys(ROSTER).filter(k => !picks.includes(k)).sort(() => Math.random() - .5).slice(0, TEAM);

  return { PT, ET, P: PT[0], E: ET[0] };
};

/* ============ tipos (ícones de tipo_pokemom.png) ============ */
function typeIcon(t, scaleCls){
  const p = TYPE_POS[t]; if(!p || !IM.types) return `<span>${(TN[t]||t).toUpperCase()}</span>`;
  const s = scaleCls ? 32 : 48, h = scaleCls ? 16 : 24;
  return `<i class="tb" title="${TN[t]||t}" style="background-position:-${p[0]*s}px -${p[1]*h}px"></i>`;
}

/* ============ tela / escala ============ */
function fit(){ const s = Math.min(innerWidth/480, innerHeight/320); $('wrap').style.transform = `scale(${s})`; }
addEventListener('resize', fit); fit();

function drawHP(p, bar, num){
  const pct = Math.max(0, p.hp / p.max * 100);
  bar.style.width = pct + '%';
  bar.className = pct > 50 ? 'hp-g' : pct > 20 ? 'hp-y' : 'hp-r';
  if(num) num.textContent = `${Math.max(0,p.hp)}/${p.max}`;
}
async function say(text, wait = 700){
  const m = $('msg'); m.textContent = '';
  for(const ch of text){ m.textContent += ch; await sleep(20); }
  await sleep(wait);
}
function show(html, cls = ''){ const mn = $('menu'); mn.innerHTML = html; mn.className = cls; mn.style.display = 'block'; }
function hideMenu(){ $('dexbtn').style.display = 'none'; const mn = $('menu'); mn.style.display = 'none'; mn.className = ''; }

function mainMenu(){
  busy = false; hidePick();
  $('msg').textContent = `O que ${G.P.name} vai fazer?`;
  show(`<button data-a="fight" aria-label="FIGHT">FIGHT</button><button data-a="bag" aria-label="BAG">BAG</button><button data-a="mon" aria-label="POKéMON">POKéMON</button><button data-a="run" aria-label="RUN">RUN</button>`);
  $('menu').firstChild.focus();
  $('dexbtn').style.display = 'block';   // Pokédex disponível durante a batalha
}
const struggleMove = () => ({n:'STRUGGLE',t:'normal',p:50,acc:100,sp:0,pp:1,max:1,fx:{recoilMax:.25}});   // usado quando todos os golpes ficam sem PP
function moveMenu(){
  const mn = $('menu'); mn.className = 'moves';
  const noPP = G.P.moves.every(m => m.pp <= 0);
  mn.innerHTML = (noPP ? `<button data-m="-1">STRUGGLE</button>` : G.P.moves.map((m,i)=>`<button data-m="${i}" ${m.pp<=0?'disabled':''}>${m.n}</button>`).join(''))
    + `<button class="chip" data-a="back">◀ VOLTAR</button><div id="info"><span id="icur"></span><span id="imax"></span><span id="ity"></span></div><div id="fxi"></div>`;
  mn.style.display = 'block'; $('msg').textContent = '';
  const info = i => { const m = i < 0 ? struggleMove() : G.P.moves[i]; $('icur').textContent = m.pp; $('imax').textContent = m.max; $('ity').innerHTML = typeIcon(m.t); $('fxi').textContent = fxText(m); };
  [...mn.querySelectorAll('[data-m]')].forEach(b => { const i = +b.dataset.m; b.onmouseenter = b.onfocus = () => info(i); });
  const first = mn.querySelector('[data-m]:not(:disabled)'); first?.focus(); info(first ? +first.dataset.m : 0);
}

/* ============ POKÉDEX: 'visto' quando aparece em batalha, 'capturado' quando entra no seu time (salvo no navegador) ============ */
const REALNO = {teddiursa:216, deoxysatk:386, deoxysdef:386};
let DX = {seen:{}, own:{}};
try{ DX = JSON.parse(localStorage.getItem('pokedex1')) || DX; }catch(e){}
const dxMark = (kind, k) => { if(DX[kind][k]) return; DX[kind][k] = 1; if(kind === 'own') DX.seen[k] = 1; try{ localStorage.setItem('pokedex1', JSON.stringify(DX)); }catch(e){} };
const dxKeys = () => Object.keys(ROSTER).sort((a, b) => (REALNO[a] || DEX[a]) - (REALNO[b] || DEX[b]));
const dxNo = k => String(REALNO[k] || DEX[k]).padStart(3, '0');
let dxCur = null;
function dxList(){
  const d = $('dex'), ks = dxKeys(), nSeen = ks.filter(k => DX.seen[k]).length, nOwn = ks.filter(k => DX.own[k]).length;
  d.className = 'on';
  d.innerHTML = `<div class="hd"><span>POKéDEX · VISTOS ${nSeen} · CAPTURADOS ${nOwn} / ${ks.length}</span><button data-x>FECHAR</button></div><div class="lst">` +
    ks.map(k => { const u = spriteURL(k, false), seen = DX.seen[k];
      return `<button data-k="${k}" class="${DX.own[k] ? 'own' : ''}"><img class="${seen ? '' : 'dex-no'}" src="${u || ''}" alt=""><span>${dxNo(k)}</span><span>${seen ? ROSTER[k][0] : '???'}</span></button>`; }).join('') + `</div><div class="dt"></div>`;
}
function dxDetail(k){
  dxCur = k; const [name, types, st, mv] = ROSTER[k], d = $('dex'), seen = DX.seen[k];
  d.classList.add('det'); const u = spriteURL(k, false);
  const rows = [['HP','hp'],['ATK','atk'],['DEF','def'],['SP.ATK','spa'],['SP.DEF','spd'],['SPEED','spe']].map(([l, f]) =>
    `<div>${l} ${seen ? st[f] : '???'}</div><div class="bar"><i style="width:${seen ? Math.min(100, st[f] / 3.2) : 0}%"></i></div>`).join('');
  d.querySelector('.dt').innerHTML = `<div><img class="${seen ? '' : 'dex-no'}" src="${u || ''}" alt=""><div style="margin-top:6px">Nº ${dxNo(k)}</div><div style="margin:4px 0">${seen ? name : '???'}</div>

/* FLAIL: quanto menos HP, mais forte (tabela da 3ª geração) */
const movePower = (a, mv) => { if(!(mv.fx && mv.fx.flail)) return mv.p; const r = Math.floor(a.hp * 64 / a.max);
  return r < 2 ? 200 : r < 6 ? 150 : r < 13 ? 100 : r < 22 ? 80 : r < 43 ? 40 : 20; };
function calc(a, d, mv){
  const atk = mv.sp ? a.spa * sm(a.st.spa) : a.atk * sm(a.st.atk), def = mv.sp ? d.spd * sm(d.st.spd) : d.def * sm(d.st.def);
  let dmg = Math.floor(Math.floor(Math.floor(2 * a.lv / 5 + 2) * movePower(a, mv) * atk / def) / 50) + 2;
  let eff = 1; d.types.forEach(t => eff *= (CHART[mv.t][t] ?? 1));
  const crit = Math.random() < CRIT[Math.min(4, a.st.crit + ((mv.fx && mv.fx.crit) || 0))];
  if(a.types.includes(mv.t)) dmg *= 1.5;
  if(a.status === 'brn' && !mv.sp) dmg *= 0.5;   // queimadura reduz o dano físico
  if(crit) dmg *= 1.5;
  dmg = eff === 0 ? 0 : Math.max(1, Math.floor(dmg * eff * (0.85 + Math.random() * 0.15)));
  return {dmg, eff, crit};
}
/* ---- status e efeitos secundários ---- */
const who = m => m === G.E ? `${m.name} inimigo` : m.name;

const SIMM = {brn:'fire', frz:'ice', psn:'poison'};          // tipos imunes a cada status
const SPOS = {psn:[6,80,20,8], brn:[6,88,20,8], par:[37,80,22,8], slp:[70,80,20,8], frz:[102,80,20,8]};   // ícones em tipo_pokemom.png

/* texto que aparece ao escolher um golpe: poder, precisão e cada efeito com a sua chance */
function fxText(m){
  const fx = m.fx || {}, t = [`POD ${m.p || '—'}`, `PREC ${fx.nomiss ? '—' : m.acc + '%'}`];
  if(fx.st) t.push(`${fx.st.c}% ${SN2[fx.st.k]}`);
  if(fx.tri) t.push(`${fx.tri}% PARALISAR/QUEIMAR/CONGELAR`);
  if(fx.conf) t.push(`${fx.conf}% CONFUNDIR`);
  if(fx.flinch) t.push(`${fx.flinch}% HESITAR`);
  if(fx.drop) t.push(`${fx.drop.c}% ${STN[fx.drop.s]} -1`);
  if(fx.self) t.push(`${STN[fx.self.s]} DO USUÁRIO ${fx.self.n}`);
  if(fx.drain) t.push(`DRENA ${Math.round(fx.drain * 100)}% DO DANO`);
  if(fx.recoil) t.push(`RECUO ${Math.round(fx.recoil * 100)}% DO DANO`);
  if(fx.recoilMax) t.push('RECUO 25% DO HP');
  if(fx.prio) t.push('PRIORIDADE');
  if(fx.crit) t.push('CRÍTICO ALTO');
  if(fx.recharge) t.push('RECARGA');
  (fx.up || []).forEach(([k, n]) => t.push(`${STN[k]} DO USUÁRIO +${n}`));
  (fx.lower || []).forEach(([k, n]) => t.push(`${STN[k]} DO ALVO ${n}`));
  if(fx.heal) t.push(`CURA ${Math.round(fx.heal * 100)}% DO HP`);
  return t.join(' · ');
}
async function sideEffects(att, def, mv, side, dmg){
  const fx = mv.fx || {}, defSide = side === 'p' ? 'e' : 'p', roll = c => Math.random() * 100 < c;
  if(def.hp > 0 && dmg > 0){
    if(fx.tri && roll(fx.tri)){ const k = ['par','brn','frz'][rnd(3)]; if(canStatus(def, k)) await giveStatus(def, k); }
    if(fx.st && roll(fx.st.c) && canStatus(def, fx.st.k)) await giveStatus(def, fx.st.k);
    if(fx.conf && roll(fx.conf) && def.conf <= 0){ def.conf = 2 + rnd(4); await say(`${who(def)} ficou confuso!`, 800); }
    if(fx.flinch && !turnActed[defSide] && roll(fx.flinch)) def.flinched = true;   // só hesita quem ainda não agiu no turno
    if(fx.drop && roll(fx.drop.c) && def.st[fx.drop.s] > -6){
      def.st[fx.drop.s] = Math.max(-6, def.st[fx.drop.s] + fx.drop.n); await say(`${STN[fx.drop.s]} de ${who(def)} caiu!`, 700); }
  }
  if(fx.self && dmg > 0){ const k = fx.self.s; att.st[k] = Math.max(-6, att.st[k] + fx.self.n); await say(`${STN[k]} de ${who(att)} caiu muito!`, 700); }
  if(fx.recharge && dmg > 0 && def.hp > 0) att.recharge = true;
}
/* animação de estágio (efeitos_status.png): faixa colorida sobe (aumentou) ou desce (caiu) sobre o sprite */
const STFX = {atk:[204,160], def:[502,160], acc:[59,441], spe:[655,441], spa:[204,725], spd:[502,725]};
async function statFx(el, k, up){

const pulse = async (el, c) => { el.classList.add(c); await sleep(800); el.classList.remove(c); };
async function transformInto(att, src, side){

  att.tf = {key:src.key}; att.types = [...src.types]; att.atk = src.atk; att.def = src.def; att.spa = src.spa; att.spd = src.spd; att.spe = src.spe;

async function statusMove(att, def, mv, side){
  if((mv.fx || {}).transform){ await transformInto(att, def, side); return; }
  const fx = mv.fx || {}, A = who(att), D = who(def), mine = $(side === 'p' ? 'ps' : 'es'), theirs = $(side === 'p' ? 'es' : 'ps');
  if((fx.lower || fx.st) && Math.random() * 100 >= mv.acc * accMul(att.st.acc)){ await say(`O ataque de ${att.name} errou!`); return; }
  for(const [k, n] of fx.up || []){
    if(att.st[k] >= 6){ await say(`${STN[k]} de ${A} não pode subir mais!`, 700); continue; }
    att.st[k] = Math.min(6, att.st[k] + n); await statFx(mine, k, true); await say(`${STN[k]} de ${A} ${n > 1 ? 'subiu muito' : 'subiu'}!`, 700); }
  for(const [k, n] of fx.lower || []){
    if(def.st[k] <= -6){ await say(`${STN[k]} de ${D} não pode cair mais!`, 700); continue; }
    def.st[k] = Math.max(-6, def.st[k] + n); await statFx(theirs, k, false); await say(`${STN[k]} de ${D} ${n < -1 ? 'caiu muito' : 'caiu'}!`, 700); }

    if(att.hp >= att.max) await say(`O HP de ${A} já está cheio!`, 700);
    else { att.hp = Math.min(att.max, att.hp + Math.floor(att.max * fx.heal)); hpDraw(side); await say(`${A} recuperou HP!`, 700); } }

}
async function attack(att, def, mv, side){
  const isP = side === 'p', fx = mv.fx || {}, A = who(att);
  turnActed[side] = true;
  if(att.recharge){ att.recharge = false; await say(`${A} precisa recarregar!`, 800); return; }
  if(att.status === 'frz'){
    if(Math.random() < .2){ att.status = null; showSt(); await say(`${A} descongelou!`, 700); }
    else { await say(`${A} está congelado e não consegue se mover!`, 800); return; }
  }
  if(att.flinched){ att.flinched = false; await say(`${A} hesitou!`, 800); return; }
  if(att.conf > 0){
    att.conf--;
    if(att.conf === 0) await say(`${A} não está mais confuso!`, 600);
    else{
      await say(`${A} está confuso!`, 500);
      if(Math.random() < .5){
        const d = Math.max(1, Math.floor(Math.floor(Math.floor(2 * att.lv / 5 + 2) * 40 * att.atk * sm(att.st.atk) / (att.def * sm(att.st.def))) / 50) + 2);
        att.hp -= d; hpDraw(side); await sleep(600); await say(`${A} se machucou na confusão!`, 800); return;
      }
    }
  }
  if(att.status === 'par' && Math.random() < .25){ await say(`${A} está paralisado! Não consegue se mover!`, 900); return; }
  await say(`${isP ? '' : 'O inimigo '}${att.name} usou ${mv.n}!`, 400);
  if(isP) mv.pp--;
  if(mv.p === 0){ await statusMove(att, def, mv, side); return; }   // golpe de status: sem dano
  if(!fx.nomiss && Math.random() * 100 >= mv.acc * accMul(att.st.acc)){ await say(`O ataque de ${att.name} errou!`); return; }
  const {dmg, eff, crit} = calc(att, def, mv);
  await effect(mv.t, side);
  const tgt = $(isP ? 'es' : 'ps');
  tgt.classList.add('hit'); await sleep(1200); tgt.classList.remove('hit');
  def.hp -= dmg;
  drawHP(def, $(isP ? 'eh' : 'ph'), isP ? null : $('pnum'));
  await sleep(900);
  if(crit) await say('Foi um golpe crítico!', 500);
  if(eff === 0) await say(`Não afeta ${def.name}...`, 500);
  else if(eff > 1) await say('É super efetivo!', 500);
  else if(eff < 1) await say('Não foi muito efetivo...', 500);
  if(dmg > 0){
    if(mv.t === 'fire' && def.status === 'frz'){ def.status = null; showSt(); await say(`${who(def)} descongelou!`, 700); }
    if(fx.drain){ att.hp = Math.min(att.max, att.hp + Math.max(1, Math.floor(dmg * fx.drain))); hpDraw(side); await say(`${A} sugou energia de ${who(def)}!`, 700); }
    if(fx.recoil || fx.recoilMax){
      att.hp -= Math.max(1, fx.recoil ? Math.floor(dmg * fx.recoil) : Math.floor(att.max * fx.recoilMax)); hpDraw(side);
      await sleep(500); await say(`${A} se feriu com o recuo!`, 700);
    }
  }
  await sideEffects(att, def, mv, side, dmg);
}
/* dano no fim do turno (queimadura / veneno) */
async function residual(skip){
  turnActed = {p:false, e:false}; G.P.flinched = G.E.flinched = false;
  for(const side of ['p','e']){
    const m = side === 'p' ? G.P : G.E; if(m.hp <= 0 || skip.has(side)) continue;
    if(m.status === 'brn' || m.status === 'psn'){
      await say(`${who(m)} sofreu com ${m.status === 'brn' ? 'a queimadura' : 'o veneno'}!`, 300);
      const el = $(side === 'p' ? 'ps' : 'es'); el.classList.add('hit'); await sleep(600); el.classList.remove('hit');
      m.hp -= Math.max(1, Math.floor(m.max / 8)); hpDraw(side); await sleep(700);
      if(m.hp <= 0 && await afterFaint(side)) return true;
    }
  }
  return false;

/* 0 = ninguém caiu, 1 = alguém caiu e foi trocado, 2 = fim de jogo */
async function checkFaints(skip){

    const m = side === 'p' ? G.P : G.E;

}

async function transformEnemy(){

  if(!RIVAL_TRANSFORM || !RIVAL_ONLY.has(e.key) || e.tf || e.hp <= 0 || t.hp <= 0) return;

async function faint(side){

}
async function afterFaint(side){
  await faint(side);
  if(side === 'e'){
    const nx = G.ET.findIndex(p => p.hp > 0);
    if(nx < 0){ await say('Você venceu a batalha!', 600); return end(); }
    await switchIn('e', nx); return false;
  }
  if(!G.PT.some(p => p.hp > 0)){ await say('Você não tem mais Pokémon... Você desmaiou!', 600); return end(); }
  const idx = await new Promise(r => { pickResolve = r; teamMenu(true); });
  await switchIn('p', idx); return false;
}
async function turn(act){
  busy = true; hideMenu(); hidePick();
  turnActed = {p:false, e:false}; G.P.flinched = G.E.flinched = false;
  const ok = G.E.moves.filter(m => m.pp > 0);
  const em = ok[Math.floor(Math.random() * ok.length)] || G.E.moves[0];
  const skip = new Set();
  const fin = async () => { if(await residual(skip)) return; mainMenu(); };
  if(act.item || act.sw !== undefined){
    turnActed.p = true;
    if(act.item) await useItem(act); else await switchIn('p', act.sw);
    await attack(G.E, G.P, em, 'e');
    if(await checkFaints(skip) === 2) return;
    return fin();
  }
  const pm = act.m < 0 ? struggleMove() : G.P.moves[act.m];
  const spd = m => m.spe * sm(m.st.spe) * (m.status === 'par' ? .25 : 1);
  const pr = mv => (mv.fx && mv.fx.prio) || 0;
  const pFirst = pr(pm) !== pr(em) ? pr(pm) > pr(em) : spd(G.P) >= spd(G.E);
  const order = pFirst ? [['p',pm],['e',em]] : [['e',em],['p',pm]];
  for(const [side, mv] of order){
    const att = side === 'p' ? G.P : G.E, def = side === 'p' ? G.E : G.P;
    await attack(att, def, mv, side);
    const r = await checkFaints(skip);
    if(r === 2) return;
    if(r === 1) break;
  }
  return fin();
}

const POCKETS = [['med','MEDICINE'],['bat','BATTLE'],['ball','POKé BALLS'],['ber','BERRIES']];
const STN = {atk:'ATAQUE',def:'DEFESA',spe:'VELOCIDADE',spa:'AT. ESPECIAL',acc:'PRECISÃO',spd:'DEF. ESPECIAL'};
let bag = {...BAG0}, bagTab = 'med', pendItem = null;
const itemIcon = it => crop('items', it.ic[0], it.ic[1], 24, 24, [255,127,39]);
const usable = (it, p) => it.kind === 'hp' ? p.hp > 0 && (p.hp < p.max || (it.id === 'fullrestore' && !!p.status)) : it.kind === 'revive' ? p.hp <= 0
  : (it.kind === 'pp' || it.kind === 'ppall') ? p.hp > 0 && p.moves.some(m => m.pp < m.max) : false;

function bagMenu(tab){
  if(tab) bagTab = tab;
  hideMenu(); const pk = $('pick');
  pk.innerHTML = Object.values(ITEMS).filter(it => it.pocket === bagTab).map(it => { const u = itemIcon(it);
    return `<button class="card sm item" data-item="${it.id}" ${bag[it.id] <= 0 ? 'disabled' : ''}><span class="im">${u ? `<img src="${u}" alt="">` : ''}</span>
      <span class="tx"><span>${it.n}</span><small>×${bag[it.id]}</small></span></button>`; }).join('');
  pk.classList.remove('team'); pk.classList.add('on','grid','bag'); $('screen').classList.add('picking');
  show(`<div class="tabs">${POCKETS.map(([k,n]) => `<button class="${k === bagTab ? 'on' : ''}" data-tab="${k}">${n}</button>`).join('')}</div><button class="chip" data-a="back">◀ VOLTAR</button>`, 'plain');
  $('msg').textContent = 'Escolha um item.';
  pk.querySelectorAll('.card').forEach(c => { c.onmouseenter = c.onfocus = () => { $('msg').textContent = ITEMS[c.dataset.item].d; }; });
  pk.scrollTop = 0; pk.querySelector('.card:not(:disabled)')?.focus({preventScroll:true});
}
function chooseItem(id){
  const it = ITEMS[id]; if(!it || bag[id] <= 0) return;
  pendItem = id;
  if(['ball','stat','crit','guard'].includes(it.kind)){ hidePick(); return turn({item:id}); }
  if(!G.PT.some(p => usable(it, p))){ $('msg').textContent = 'Não terá nenhum efeito.'; return; }
  hideMenu(); const pk = $('pick'); pk.classList.remove('grid','bag'); pk.classList.add('team','on');
  pk.innerHTML = G.PT.map((p,i) => cardHTML(p, `data-use="${i}" ${usable(it, p) ? '' : 'disabled'}`,
    `HP ${Math.max(0,p.hp)}/${p.max}${p === G.P ? ' · EM CAMPO' : p.hp <= 0 ? ' · DESMAIADO' : ''}`, true)).join('');
  $('screen').classList.add('picking');
  show(`<button class="chip" data-a="bag">◀ VOLTAR</button>`, 'plain');
  $('msg').textContent = `Usar ${it.n} em qual POKéMON?`;
  pk.querySelector('.card:not(:disabled)')?.focus();
}
function useOn(i){
  const it = ITEMS[pendItem];
  if(it.kind === 'pp') return ppMenu(i);
  hidePick(); turn({item:pendItem, target:i});
}
function ppMenu(i){
  const p = G.PT[i]; hidePick();
  show(p.moves.map((m,j) => `<button data-pp="${j}" data-t="${i}" ${m.pp >= m.max ? 'disabled' : ''}>${m.n}</button>`).join('')
    + `<button class="chip" data-a="bag">◀ VOLTAR</button><div id="info"><span id="icur"></span><span id="imax"></span><span id="ity"></span></div>`, 'moves');
  $('msg').textContent = '';
  const info = j => { const m = p.moves[j]; $('icur').textContent = m.pp; $('imax').textContent = m.max; $('ity').innerHTML = typeIcon(m.t); };
  const mn = $('menu'); [...mn.querySelectorAll('[data-pp]')].forEach(b => { const j = +b.dataset.pp; b.onmouseenter = b.onfocus = () => info(j); });
  const first = mn.querySelector('[data-pp]:not(:disabled)'); first?.focus(); info(first ? +first.dataset.pp : 0);
}
const refresh = m => { if(m === G.P) drawHP(m, $('ph'), $('pnum')); balls(); };
async function useItem({item, target, move}){
  const it = ITEMS[item], P = G.P, mon = target !== undefined ? G.PT[target] : P;
  bag[item]--;
  await say(`Você usou ${it.n}${target !== undefined ? ` em ${mon.name}` : ''}!`, 500);
  const full = it.v === 'max';
  if(it.kind === 'hp'){
    if(it.id === 'fullrestore' && mon.status){ mon.status = null; mon.conf = 0; showSt(); await say(`${mon.name} ficou curado!`, 600); }
    const b = mon.hp; mon.hp = Math.min(mon.max, mon.hp + (full ? mon.max : it.v)); refresh(mon);
    await sleep(900); await say(`${mon.name} recuperou ${mon.hp - b} de HP!`, 600);
  } else if(it.kind === 'revive'){
    mon.hp = Math.max(1, Math.floor(mon.max * it.v)); mon.status = null; mon.conf = 0; refresh(mon); await sleep(500);
    await say(`${mon.name} foi revivido!`, 600);
  } else if(it.kind === 'pp'){
    const m = mon.moves[move], b = m.pp; m.pp = Math.min(m.max, m.pp + (full ? m.max : it.v));
    await say(`O PP de ${m.n} recuperou ${m.pp - b}!`, 600);
  } else if(it.kind === 'ppall'){
    mon.moves.forEach(m => m.pp = Math.min(m.max, m.pp + (full ? m.max : it.v)));
    await say('O PP de todos os golpes foi restaurado!', 600);
  } else if(it.kind === 'stat'){
    if(P.st[it.v] >= 6) await say(`${STN[it.v]} de ${P.name} não vai mais subir!`, 600);
    else { P.st[it.v]++; await say(`${STN[it.v]} de ${P.name} subiu!`, 600); }
  } else if(it.kind === 'crit'){
    P.st.crit = Math.min(4, P.st.crit + it.v); await say(`${P.name} está pronto para golpes críticos!`, 600);
  } else if(it.kind === 'guard'){
    await say(`Os atributos de ${P.name} estão protegidos!`, 600);
  } else if(it.kind === 'ball'){
    await say('O treinador bloqueou a bola!', 700); await say('Não seja ladrão!', 700);
  }
}

/* ============ cliques e teclado ============ */
$('pick').addEventListener('click', e => {
  const b = e.target.closest('.card'); if(!b || b.disabled) return;
  if(b.dataset.item){ chooseItem(b.dataset.item); return; }
  if(b.dataset.use !== undefined){ useOn(+b.dataset.use); return; }
  if(b.dataset.pick){ picks.push(b.dataset.pick); picks.length < TEAM ? showPick() : start(picks.slice()); return; }
  if(b.dataset.sw !== undefined){
    const i = +b.dataset.sw; hidePick();
    if(pickResolve){ const r = pickResolve; pickResolve = null; hideMenu(); return r(i); }
    if(busy) return; return turn({sw:i});
  }
});
$('menu').addEventListener('click', async e => {
  const b = e.target.closest('button'); if(!b || b.disabled || busy) return;
  if(b.dataset.tab){ bagMenu(b.dataset.tab); return; }
  if(b.dataset.pp !== undefined) return turn({item:pendItem, target:+b.dataset.t, move:+b.dataset.pp});
  if(b.dataset.m !== undefined) return turn({m:+b.dataset.m});
  const a = b.dataset.a;
  if(a === 'fight') moveMenu();
  else if(a === 'mon') teamMenu(false);
  else if(a === 'bag') bagMenu();
  else if(a === 'back'){ hideMenu(); hidePick(); mainMenu(); }
  else if(a === 'again'){ hideMenu(); picks = []; $('screen').classList.remove('battle'); showTitle(); }
  else{ busy = true; hideMenu();
    await say(a === 'run' ? 'Não dá para fugir de uma batalha de treinador!' : 'Você não tem itens na mochila.', 900);
    mainMenu(); }
});
addEventListener('keydown', e => {
  if($('scene').classList.contains('on')){
    if(['Enter',' ','z','Z'].includes(e.key)){ e.preventDefault(); $('sceneBtn').click(); } return; }
  const pick = $('pick').classList.contains('on');
  const bs = [...document.querySelectorAll(pick ? '#pick .card:not(:disabled)' : '#menu button:not(:disabled):not(.chip)')]; if(!bs.length) return;
  const i = bs.indexOf(document.activeElement);
  const st = !pick ? 1 : $('pick').classList.contains('grid') ? 4 : $('pick').classList.contains('team') ? 3 : 1;
  const go = d => { const j = i < 0 ? 0 : Math.min(bs.length - 1, Math.max(0, i + d)); bs[j].focus(); e.preventDefault(); };
  if(e.key === 'ArrowRight') go(1);
  if(e.key === 'ArrowLeft') go(-1);
  if(e.key === 'ArrowDown') go(st);
  if(e.key === 'ArrowUp') go(-st);
  if(e.key === 'x' || e.key === 'Escape') document.querySelector('#menu .chip')?.click();
});

async function start(team){
  busy = true; hideMenu(); hidePick(); G = newGame(team); bag = {...BAG0}; team.forEach(k => dxMark('own', k));
  $('screen').classList.add('battle'); $('bg').style.visibility = 'visible'; load('e'); load('p');
  const tr = showTrainer();
  if(tr) $('ps').style.visibility = 'hidden';
  await say('O treinador rival quer batalhar!', 800);
  await say(`Rival enviou ${G.E.name}!`, 600);
  await say(`Vai, ${G.P.name}!`, 300);
  await shinyMsg(G.P);
  if(tr){ await throwBall(); const ps = $('ps'); ps.style.visibility = ''; ps.classList.add('pop'); setTimeout(() => ps.classList.remove('pop'), 500); }
  await sleep(500);
  await transformEnemy();
  mainMenu();
}

/* ============ introdução: copyright → Game Freak → Gengar vs. Nidorino → título ============ */
const SC = { copy:[8,42], gf1:[249,203], gf2:[490,203], gf3:[731,203], gen1:[8,1029], gen2:[8,1205], title:[490,1683] };
function scene(name){
  const s = $('scene'), im = IM.scenes, [x,y] = SC[name];
  if(im && name === 'title'){   // a folha usa laranja (255,90,0) como cor transparente: vira preto
    const u = crop('scenes', x, y, 240, 160, [255,90,0], true);
    s.style.backgroundImage = `url(${u})`; s.style.backgroundSize = '480px 320px'; s.style.backgroundPosition = '0 0';
  } else if(im){ s.style.backgroundImage = `url(${IMG.scenes})`; s.style.backgroundSize = `${im.width*2}px ${im.height*2}px`; s.style.backgroundPosition = `-${x*2}px -${y*2}px`; }
  s.classList.toggle('title', name === 'title'); s.classList.add('on');
}
const fade = async on => { $('fade').classList.toggle('on', on); await sleep(380); };
const wait = ms => new Promise(r => { const t = setTimeout(r, ms); introSkip = () => { clearTimeout(t); r(); }; });
let skipAll = false;
async function intro(){
  $('screen').classList.remove('battle'); hideMenu(); hidePick(); $('msg').textContent = '';
  skipAll = false;
  const steps = [['copy',2200],['gf1',900],['gf2',900],['gf3',1500],['gen1',1900],['gen2',1500]];
  for(const [n, ms] of steps){
    if(skipAll) break;
    scene(n); await fade(false); await wait(ms);
    if(!skipAll && (n === 'copy' || n === 'gf3' || n === 'gen2')) await fade(true);
  }
  await showTitle();
}
async function showTitle(){
  skipAll = true; introSkip = null;
  $('msg').textContent = '';
  scene('title'); await fade(false);
  $('sceneBtn').onclick = async () => {
    $('sceneBtn').onclick = null;
    await fade(true);
    $('scene').classList.remove('on');
    picks = []; showPick(); await fade(false);
  };
  $('sceneBtn').focus();
}
$('sceneBtn').onclick = () => { if(!skipAll){ skipAll = true; introSkip && introSkip(); } };


/* ============ campo em camadas: céu/campo + base do inimigo + base do jogador ============
   O painel de grama de base_de_pokemom.png (240x112, na posição 249,6) vem com as bases já desenhadas.
   Aqui ele é separado em 3 imagens: o fundo sem as bases (cada linha vira uma cor lisa) e cada base
   com transparência. Se o navegador bloquear o canvas, continua valendo o recorte antigo do #bg. */
function buildField(){
  const img = IM.bg; if(!img) return;
  try{
    const PX = 249, PY = 6, W = 240, H = 112;
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const cx = cv.getContext('2d'); cx.drawImage(img, PX, PY, W, H, 0, 0, W, H);
    const src = cx.getImageData(0, 0, W, H).data;
    const px = (x, y) => { const i = (y * W + x) * 4; return [src[i], src[i+1], src[i+2]]; };
    const row = [];                                  // cor lisa de cada linha (lida numa coluna sem base)
    for(let y = 0; y < H; y++) row.push(y < 96 ? px(0, y) : px(W - 1, y));
    // fundo sem bases
    const f = document.createElement('canvas'); f.width = W; f.height = H;
    const fx = f.getContext('2d');
    for(let y = 0; y < H; y++){ fx.fillStyle = `rgb(${row[y]})`; fx.fillRect(0, y, W, 1); }
    // recorta uma base: só os pixels diferentes da cor do fundo da linha ficam opacos
    const cut = (x0, y0, w, h) => {
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const k = c.getContext('2d'), d = k.createImageData(w, h);
      for(let y = 0; y < h; y++) for(let x = 0; x < w; x++){
        const p = px(x0 + x, y0 + y), r = row[y0 + y], i = (y * w + x) * 4;
        const same = p[0] === r[0] && p[1] === r[1] && p[2] === r[2];
        d.data[i] = p[0]; d.data[i+1] = p[1]; d.data[i+2] = p[2]; d.data[i+3] = same ? 0 : 255;
      }
      k.putImageData(d, 0, 0); return c.toDataURL();
    };
    const base = cut(112, 46, 128, 34);              // plataforma de grama do inimigo
    const bg = $('bg');
    bg.style.backgroundImage = `url(${f.toDataURL()})`;
    bg.style.backgroundPosition = '0 0'; bg.style.backgroundSize = '480px 224px';
    for(const id of ['be', 'bp']){ const e = $(id); e.style.backgroundImage = `url(${base})`; e.classList.add('on'); }
  }catch(e){ /* sem canvas: mantém o fundo antigo */ }
}

/* ============ início ============ */
(async () => {
  await loadAll();
  buildField();
  if(IM.ui){ // moldura dos cartões = caixa branca/lilás de battle_menu.png (região sem texto)
    const u = crop('ui', 297, 4, 162, 48, [255,255,255], false);
    // crop() apaga o fundo branco externo; assim a moldura fica transparente fora das bordas
    if(u) document.documentElement.style.setProperty('--card', `url(${u})`);
  }
  if(IM.sprites && !crop('sprites', 0, 0, 1, 1)){   // canvas bloqueado: acontece ao abrir o index.html direto do disco
    missing.push('(os sprites não carregam abrindo o arquivo direto: use o link do GitHub Pages ou o Live Server do VS Code)');
  }
  if(missing.length){
    const d = document.createElement('div');
    d.style.cssText = 'position:absolute;left:0;right:0;top:0;z-index:99;background:#a00;color:#fff;font-size:8px;line-height:12px;padding:6px';
    d.textContent = 'Arquivo(s) não encontrado(s): ' + missing.join(', ');
    $('screen').appendChild(d);
  }
  intro();
})();
