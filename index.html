<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light only">
<meta name="darkreader-lock">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Batalha estilo FireRed</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#1b1f2a;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:'Press Start 2P','Courier New',monospace;-webkit-user-select:none;user-select:none}
#wrap{width:480px;height:320px;flex:none;transform-origin:center}
#screen{position:relative;width:480px;height:320px;overflow:hidden;background:#000;image-rendering:pixelated}
#screen *{image-rendering:pixelated}

/* ---------- campo de batalha ---------- */
#bg{position:absolute;left:0;top:0;width:480px;height:224px;z-index:0;background:#bfe3f2 url(img/base_de_pokemom.png) -498px -12px/1474px 932px no-repeat}
.base{position:absolute;z-index:0;display:none;background-repeat:no-repeat;background-size:100% 100%}
#be{left:224px;top:92px;width:256px;height:68px}
#bp{left:-8px;top:146px;width:256px;height:68px}
#screen.battle .base.on{display:block}
.spr{position:absolute;width:128px;height:128px;transition:transform .5s,opacity .5s}
.spr img{width:100%;height:100%;display:block}
#es{left:300px;top:14px}
#ps{left:56px;top:72px}
#tr{left:56px;top:72px;z-index:2}
.hit{animation:hit .4s steps(2) 3}
@keyframes hit{50%{opacity:0}}
.faint{transform:translateY(80px)!important;opacity:0}
.pop{animation:pop .4s steps(4)}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:none;opacity:1}}
#fx{position:absolute;left:0;top:0;width:480px;height:224px;overflow:hidden;pointer-events:none;z-index:3}
#screen:not(.battle) .spr,#screen:not(.battle) .box,#screen:not(.battle) .balls{display:none}

/* ---------- caixas de HP (battle_menu.png, 2x) ---------- */
.box{position:absolute;background:url(img/battle_menu.png) no-repeat;background-size:1228px 592px;color:#404040;text-shadow:1px 1px 0 #d8d0b0;white-space:nowrap}
#eb{left:16px;top:16px;width:200px;height:58px;background-position:-6px -6px}
#pb{left:264px;top:148px;width:208px;height:74px;background-position:-6px -88px}
.box .n{position:absolute;font-size:10px;top:11px}
.box .lv{position:absolute;font-size:9px;top:12px}
#eb .n{left:14px} #eb .lv{left:166px}
#pb .n{left:26px} #pb .lv{left:183px}
.trk{position:absolute;height:6px;background:#506058;overflow:hidden}
#eb .trk{left:78px;top:34px;width:96px}
#pb .trk{left:96px;top:34px;width:96px}
.trk i{display:block;height:100%;width:100%;transition:width .8s steps(24)}
.hp-g{background:linear-gradient(#58d080 0 2px,#70f8a8 2px)}
.hp-y{background:linear-gradient(#c8a808 0 2px,#f8e038 2px)}
.hp-r{background:linear-gradient(#a84048 0 2px,#f85838 2px)}
.hn{position:absolute;right:16px;top:45px;font-size:9px}
.balls{position:absolute;display:flex;gap:2px;z-index:1}
.balls b{display:block;width:14px;height:14px;background:url(img/battle_menu.png) no-repeat;background-size:1228px 592px}
.balls b.ok{background-position:-266px -130px}
.balls b.ko{background-position:-286px -130px}
#eballs{left:20px;top:2px}
#pballs{left:266px;top:134px}

/* ---------- texto + menus (battle_menu.png, 2x) ---------- */
#text{position:absolute;left:0;top:224px;width:480px;height:96px;background:url(img/battle_menu.png) -594px -112px/1228px 592px no-repeat}
#msg{position:absolute;left:24px;top:22px;width:420px;color:#f8f8f8;text-shadow:2px 2px 0 #6a6a6a;font-size:12px;line-height:28px}
#menu{position:absolute;right:0;top:224px;width:240px;height:96px;display:none;background:url(img/battle_menu.png) -292px -8px/1228px 592px no-repeat}
#menu.moves{width:480px;background-position:-594px -8px}
#menu.plain{width:480px;background:none;pointer-events:none}
#menu.plain button{pointer-events:auto}
#menu button{font:inherit;background:none;border:0;color:#404040;text-align:left;cursor:pointer;position:absolute;white-space:nowrap;text-shadow:1px 1px 0 #d8d0b0}
#menu button:focus{outline:none}
#menu button:hover::before,#menu button:focus-visible::before,#menu button:focus::before{content:'';position:absolute;left:-18px;top:50%;margin-top:-10px;width:12px;height:20px;background:url(img/battle_menu.png) -538px -8px/1228px 592px no-repeat}
#menu button:disabled{opacity:.45;cursor:default}
#menu button:disabled::before{display:none}
/* menu principal: o texto FIGHT/BAG/POKéMON/RUN já está desenhado na imagem */
#menu [data-a=fight],#menu [data-a=bag],#menu [data-a=mon],#menu [data-a=run]{width:100px;height:28px;color:transparent;text-shadow:none}
#menu [data-a=fight]{left:30px;top:20px} #menu [data-a=bag]{left:142px;top:20px}
#menu [data-a=mon]{left:30px;top:52px}   #menu [data-a=run]{left:142px;top:52px}
#menu [data-a=again]{left:40px;top:54px;font-size:10px;width:230px;height:28px;color:#f8f8f8;text-shadow:2px 2px 0 #6a6a6a}
/* menu de golpes */
#menu.moves [data-m]{width:150px;height:28px;font-size:11px}
#menu.moves [data-m="0"]{left:38px;top:16px} #menu.moves [data-m="1"]{left:188px;top:16px}
#menu.moves [data-m="2"]{left:38px;top:50px} #menu.moves [data-m="3"]{left:188px;top:50px}
#menu .chip{right:6px;left:auto;top:-214px;font-size:8px;color:#f8f8f8;background:#283030;border:2px solid #a0a0b8;padding:5px 8px;z-index:4;text-shadow:none}
#menu .chip::before{display:none!important}
#info span{position:absolute;display:block;font-size:10px;color:#404040;text-shadow:1px 1px 0 #d8d0b0}
#icur{left:368px;top:30px;width:46px;text-align:right}
#imax{left:440px;top:30px;width:30px}
#ity{left:392px;top:52px;height:24px}
.tb{display:inline-block;width:48px;height:24px;background:url(img/tipo_pokemom.png) 0 0/192px 144px no-repeat}

/* ---------- cenas iniciais (cenas_iniciais.png, 2x) ---------- */
#scene{position:absolute;inset:0;z-index:20;background-color:#000;background-repeat:no-repeat;display:none}
#scene.on{display:block}
#scene .blink{display:none;position:absolute;left:84px;top:252px;width:180px;height:24px;background:#000;animation:blink 1s steps(1) infinite}
#scene.title .blink{display:block}
@keyframes blink{0%,60%{opacity:0}61%,100%{opacity:1}}
#scene button{position:absolute;inset:0;width:100%;height:100%;background:none;border:0;cursor:pointer;opacity:0}
#fade{position:absolute;inset:0;z-index:30;background:#000;opacity:0;pointer-events:none;transition:opacity .35s}
#fade.on{opacity:1}

/* ---------- escolha / troca de Pokémon ---------- */
#pick{position:absolute;left:0;top:0;width:480px;height:224px;z-index:6;display:none;grid-template-columns:1fr 1fr;grid-auto-rows:100px;align-content:start;gap:8px;padding:8px}
#screen.picking .spr,#screen.picking .box,#screen.picking .balls,#screen.picking #fx{visibility:hidden}
#pick.on{display:grid}
#pick.grid{grid-template-columns:repeat(4,1fr);grid-auto-rows:108px;gap:6px;padding:8px;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:#c8a840 #283030}
.card.sm{flex-direction:column;justify-content:center;gap:2px;padding:0;border-width:8px;border-image:var(--card) 7 fill/8px stretch;text-align:center}
.card.sm .im{margin:0}
.card.sm .tx{align-items:center;gap:3px;font-size:7px}
.card.sm .tx small{display:none}
#pick.team{grid-template-columns:repeat(3,1fr);grid-auto-rows:100px;gap:6px;padding:8px;overflow-y:auto;scrollbar-width:thin}
#pick.team .card.sm .im,#pick.team .card.sm .im img{width:48px;height:48px}
#pick.team .card.sm .ty{display:none}
#pick.team .card.sm .tx small{display:block;font-size:6px}
.card.sm:hover::before,.card.sm:focus::before{left:-3px;margin-top:-20px}
.card{position:relative;font:inherit;color:#404040;text-align:left;cursor:pointer;display:flex;align-items:center;gap:6px;padding:0 6px 0 22px;border:14px solid transparent;border-image:var(--card) 7 fill/14px stretch;background:none;text-shadow:1px 1px 0 #d8d0b0;min-width:0}
.card:focus{outline:none}
.card:hover::before,.card:focus::before{content:'';position:absolute;left:-10px;top:50%;margin-top:-10px;width:12px;height:20px;background:url(img/battle_menu.png) -538px -8px/1228px 592px no-repeat}
.card:disabled{opacity:.5;cursor:default}
.card:disabled::before{display:none}
.card .im{width:64px;height:64px;flex:none;margin-left:-6px}
.card .im img{width:64px;height:64px;display:block}
.card .tx{display:flex;flex-direction:column;gap:5px;font-size:9px;min-width:0}
.card .tx small{font-size:7px;color:#605848}
.card .ty{display:flex;gap:2px}
.card .tb{width:32px;height:16px;background-size:128px 96px}
#msg small{font-size:9px}

@media (prefers-reduced-motion:reduce){#scene .blink{animation:none}}
</style>
</head>
<body>
<div id="wrap">
<div id="screen">
  <div id="bg"></div>
  <div class="base" id="be"></div><div class="base" id="bp"></div>
  <div class="spr" id="es"></div><div class="spr" id="ps"></div><div class="spr" id="tr"></div>
  <div id="fx"></div>
  <div class="balls" id="eballs"></div><div class="balls" id="pballs"></div>
  <div class="box" id="eb"><span class="n" id="en"></span><span class="lv" id="el"></span><div class="trk"><i id="eh" class="hp-g"></i></div></div>
  <div class="box" id="pb"><span class="n" id="pn"></span><span class="lv" id="pl"></span><div class="trk"><i id="ph" class="hp-g"></i></div><span class="hn" id="pnum"></span></div>
  <div id="pick"></div>
  <div id="text"><div id="msg"></div></div>
  <div id="menu"></div>
  <div id="scene"><div class="blink"></div><button id="sceneBtn" aria-label="Continuar"></button></div>
  <div id="fade"></div>
</div>
</div>
<script>
/* ============ arquivos (pasta img/) ============ */
const IMG = {
  sprites:'img/pokemons.png', bg:'img/base_de_pokemom.png', types:'img/tipo_pokemom.png',
  ui:'img/battle_menu.png', scenes:'img/cenas_iniciais.png', chars:'img/personagens.png', fx:'img/ataque_efeitos.png'
};
const DEX = {};   // nº da Pokédex de cada Pokémon = posição na folha (15 por linha); preenchido a partir de POKE
/* posição [coluna, linha] de cada tipo na folha tipo_pokemom.png (ícones de 32x16) */
const TYPE_POS = { normal:[0,0], fighting:[1,0], flying:[2,0], poison:[3,0], ground:[0,1], rock:[1,1], bug:[2,1], ghost:[3,1],
                   steel:[0,2], fire:[2,2], water:[3,2], grass:[0,3], electric:[1,3], psychic:[2,3], ice:[3,3], dragon:[0,4], dark:[1,4] };
const TN = {normal:'NORMAL',fighting:'LUTADOR',flying:'VOADOR',poison:'VENENO',ground:'TERRA',rock:'PEDRA',bug:'INSETO',ghost:'FANTASMA',fire:'FOGO',water:'ÁGUA',grass:'PLANTA',electric:'ELÉTRICO',psychic:'PSÍQUICO',ice:'GELO',dragon:'DRAGÃO'};

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const IM = {};            // imagens carregadas
const missing = [];

function loadAll(){
  return Promise.all(Object.entries(IMG).map(([k, src]) => new Promise(res => {
    const im = new Image(); im.onload = () => { IM[k] = im; res(); };
    im.onerror = () => { missing.push(src); res(); }; im.src = src;
  })));
}

/* recorta uma região da folha; apaga a cor de fundo (all=true: em toda a região; senão só o fundo ligado às bordas) */
const cropCache = {};
function crop(key, x, y, w, h, bg, all){
  const id = [key,x,y,w,h].join(','); if(id in cropCache) return cropCache[id];
  const img = IM[key]; if(!img) return null;
  try{
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const cx = cv.getContext('2d'); cx.drawImage(img, x, y, w, h, 0, 0, w, h);
    const d = cx.getImageData(0, 0, w, h), p = d.data, c = bg || [p[0], p[1], p[2]];
    const same = i => p[i] === c[0] && p[i+1] === c[1] && p[i+2] === c[2];
    if(all){ for(let i = 0; i < p.length; i += 4) if(same(i)) p[i+3] = 0; }
    else{
      const seen = new Uint8Array(w * h), st = [];
      for(let k = 0; k < w; k++) st.push(k, (h - 1) * w + k);
      for(let k = 0; k < h; k++) st.push(k * w, k * w + w - 1);
      while(st.length){
        const q = st.pop(), i = q * 4;
        if(seen[q] || !same(i)) continue;
        seen[q] = 1; p[i+3] = 0;
        const X = q % w, Y = (q / w) | 0;
        if(X > 0) st.push(q - 1); if(X < w - 1) st.push(q + 1);
        if(Y > 0) st.push(q - w); if(Y < h - 1) st.push(q + w);
      }
    }
    cx.putImageData(d, 0, 0); return cropCache[id] = cv.toDataURL();
  }catch(e){ return null; }
}
const spriteURL = (key, back, shiny) => { const n = DEX[key] - 1, r = Math.floor(n / 15), c = n % 15;
  return crop('sprites', 11 + 130 * c + (shiny ? 65 : 0), 46 + 165 * r + (back ? 65 : 0), 64, 64); };
const trainerFrame = i => crop('chars', 8 + 65 * i, 225, 64, 64, [255,127,39]);

/* ============ efeitos de ataque: [x, y, largura, altura] em ataque_efeitos.png ============ */
const FX = { fire:[7,218,28,30], water:[61,166,31,31], ice:[430,319,25,27], grass:[326,488,13,19], normal:[231,577,32,32], flying:[320,330,27,11], electric:[321,617,31,160] };
const fxURL = t => crop('fx', ...FX[t], [34,177,76], true);
async function effect(type, side){
  if(!FX[type]) type = 'normal';
  const url = fxURL(type); if(!url) return;
  const f = $('fx'), isP = side === 'p';
  const A = isP ? [130,150] : [350,70], T = isP ? [350,70] : [130,150];
  const sc = type === 'electric' ? 1.3 : type === 'flying' ? 3 : 2.2, w = FX[type][2] * sc, h = FX[type][3] * sc;
  const pos = (p, s = 1, r = 0) => `translate(${p[0] - w/2}px,${p[1] - h/2}px) scale(${s}) rotate(${r}deg)`;
  const mkImg = () => { const im = new Image(); im.src = url; im.style.cssText = `position:absolute;left:0;top:0;width:${w}px;height:${h}px;opacity:0`; f.appendChild(im); return im; };
  const an = [];
  if(type === 'electric'){
    const P = [T[0], T[1] + 20];
    an.push(mkImg().animate([{transform:pos(P),opacity:0},{opacity:1,offset:.1},{opacity:.2,offset:.3},{opacity:1,offset:.5},{opacity:.2,offset:.7},{opacity:1,offset:.85},{transform:pos(P),opacity:0}], {duration:800, fill:'both'}));
  } else if(type === 'normal'){
    for(let i = 0; i < 3; i++){ const P = [T[0] + (i - 1) * 18, T[1] + (i % 2) * 14 - 7];
      an.push(mkImg().animate([{transform:pos(P,.3),opacity:1},{transform:pos(P,1.5,45),opacity:1,offset:.6},{transform:pos(P,1.8,90),opacity:0}], {duration:380, delay:i * 260, fill:'both'})); }
  } else {
    for(let i = 0; i < 5; i++){ const j = (i % 2 ? 12 : -12) + (i - 2) * 4;
      an.push(mkImg().animate([{transform:pos([A[0],A[1]+j],.6),opacity:1},{transform:pos([T[0],T[1]+j],1,type === 'grass' ? 360 : 0),opacity:1,offset:.8},{transform:pos([T[0],T[1]+j],1.6),opacity:0}], {duration:560, delay:i * 130, fill:'both', easing:'ease-in'})); }
  }
  await Promise.all(an.map(a => a.finished.catch(() => 0)));
  f.innerHTML = '';
}

/* treinador (costas): frames 0..4 = parado + lançando a bola */
function showTrainer(){
  const u = trainerFrame(0); if(!u) return false;
  const t = $('tr'); t.style.transition = 'none'; t.style.opacity = 1; t.style.transform = 'none';
  t.innerHTML = `<img src="${u}" alt="">`; return true;
}
async function throwBall(){
  const t = $('tr'); if(!t.firstChild) return;
  for(let i = 1; i < 5; i++){ const u = trainerFrame(i); if(u) t.firstChild.src = u; await sleep(120); }
  t.style.transition = 'transform .5s,opacity .5s'; t.style.transform = 'translateX(-220px)'; t.style.opacity = 0;
  await sleep(500); t.innerHTML = '';
}

/* ============ dados ============ */
/* tabela de tipos: CHART[tipo do golpe][tipo do alvo] = multiplicador (o que não está aqui vale 1) */
const CHART = {
  normal:{rock:.5,ghost:0},
  fire:{grass:2,ice:2,bug:2,fire:.5,water:.5,rock:.5,dragon:.5},
  water:{fire:2,ground:2,rock:2,water:.5,grass:.5,dragon:.5},
  electric:{water:2,flying:2,electric:.5,grass:.5,dragon:.5,ground:0},
  grass:{water:2,ground:2,rock:2,fire:.5,grass:.5,poison:.5,flying:.5,bug:.5,dragon:.5},
  ice:{grass:2,ground:2,flying:2,dragon:2,fire:.5,water:.5,ice:.5},
  fighting:{normal:2,ice:2,rock:2,poison:.5,flying:.5,psychic:.5,bug:.5,ghost:0},
  poison:{grass:2,poison:.5,ground:.5,rock:.5,ghost:.5},
  ground:{fire:2,electric:2,poison:2,rock:2,grass:.5,bug:.5,flying:0},
  flying:{grass:2,fighting:2,bug:2,electric:.5,rock:.5},
  psychic:{fighting:2,poison:2,psychic:.5},
  bug:{grass:2,psychic:2,fire:.5,fighting:.5,poison:.5,flying:.5,ghost:.5},
  rock:{fire:2,ice:2,flying:2,bug:2,fighting:.5,ground:.5},
  ghost:{ghost:2,psychic:2,normal:0},
  dragon:{dragon:2}
};
const mk = (name,types,s,moves)=>({name,types,lv:50,max:s.hp,hp:s.hp,...s,moves:moves.map(m=>({n:m[0],t:m[1],p:m[2],acc:m[3],sp:m[4],pp:m[5],max:m[5]}))});

/* golpes: [nome, tipo, poder, precisão, PP] — físico/especial é definido pelo tipo (regra das gerações 1-3) */
const MOVES = {};
[
 ['BODY SLAM','normal',85,100,15],['HYPER BEAM','normal',150,90,5],['SLAM','normal',80,75,20],['SLASH','normal',70,100,20],
 ['QUICK ATTACK','normal',40,100,30],['DOUBLE-EDGE','normal',120,100,15],['STRENGTH','normal',80,100,15],['HEADBUTT','normal',70,100,15],
 ['SWIFT','normal',60,100,20],['TRI ATTACK','normal',80,100,10],['HYPER FANG','normal',80,90,15],['MEGA PUNCH','normal',80,85,20],
 ['MEGA KICK','normal',120,75,5],['CUT','normal',50,95,30],
 ['FLAMETHROWER','fire',90,100,15],['FIRE BLAST','fire',110,85,5],['FIRE PUNCH','fire',75,100,15],
 ['HYDRO PUMP','water',110,80,5],['SURF','water',90,100,15],['WATERFALL','water',80,100,15],['CRABHAMMER','water',90,85,10],
 ['THUNDERBOLT','electric',90,100,15],['THUNDER','electric',110,70,10],['THUNDER PUNCH','electric',75,100,15],
 ['SOLAR BEAM','grass',120,100,10],['GIGA DRAIN','grass',75,100,10],['RAZOR LEAF','grass',55,95,25],
 ['ICE BEAM','ice',90,100,10],['BLIZZARD','ice',110,70,5],['ICE PUNCH','ice',75,100,15],
 ['CROSS CHOP','fighting',100,80,5],['SUBMISSION','fighting',80,80,20],['DYNAMIC PUNCH','fighting',100,50,5],['HI JUMP KICK','fighting',130,90,10],
 ['SLUDGE BOMB','poison',90,100,10],['POISON JAB','poison',80,100,20],
 ['EARTHQUAKE','ground',100,100,10],
 ['WING ATTACK','flying',60,100,35],['AIR SLASH','flying',75,95,15],['FLY','flying',90,95,15],['DRILL PECK','flying',80,100,20],
 ['PSYCHIC','psychic',90,100,10],
 ['BUG BUZZ','bug',90,100,10],['X-SCISSOR','bug',80,100,15],['MEGAHORN','bug',120,85,10],
 ['ROCK SLIDE','rock',75,90,10],['STONE EDGE','rock',100,80,5],
 ['SHADOW BALL','ghost',80,100,15],['SHADOW PUNCH','ghost',60,100,20],
 ['DRAGON CLAW','dragon',80,100,15],['DRAGON PULSE','dragon',85,100,10],['OUTRAGE','dragon',120,100,10]
].forEach(m => MOVES[m[0]] = m);
const PHYS = new Set(['normal','fighting','flying','poison','ground','rock','bug','ghost','steel']);
const moveRow = n => { const m = MOVES[n]; if(!m) throw new Error('golpe inexistente: ' + n); return [m[0], m[1], m[2], m[3], PHYS.has(m[1]) ? 0 : 1, m[4]]; };
/* stats no nível 50 (IV 31, EV 0): HP = (2B+31)/2 + 60 ; demais = (2B+31)/2 + 5 */
const statsOf = b => { const f = (v, add) => Math.floor((2 * v + 31) / 2) + add;
  return { hp:f(b[0],60), atk:f(b[1],5), def:f(b[2],5), spa:f(b[3],5), spd:f(b[4],5), spe:f(b[5],5) }; };

/* Pokémon: [nº da Pokédex, NOME, tipos, base stats [HP,ATK,DEF,SPA,SPD,SPE], 4 golpes] — só as evoluções finais da folha */

/* ============ tipos (ícones de tipo_pokemom.png) ============ */
function typeIcon(t, scaleCls){
  const p = TYPE_POS[t]; if(!p || !IM.types) return `<span>${(TN[t]||t).toUpperCase()}</span>`;
  const s = scaleCls ? 32 : 48, h = scaleCls ? 16 : 24;
  return `<i class="tb" title="${TN[t]||t}" style="background-position:-${p[0]*s}px -${p[1]*h}px"></i>`;
}

function fit(){ const s = Math.min(innerWidth/480, innerHeight/320); $('wrap').style.transform = `scale(${s})`; }
addEventListener('resize', fit); fit();

function drawHP(p, bar, num){
  const pct = Math.max(0, p.hp / p.max * 100);
  bar.style.width = pct + '%';
  bar.className = pct > 50 ? 'hp-g' : pct > 20 ? 'hp-y' : 'hp-r';
  if(num) num.textContent = `${Math.max(0,p.hp)}/${p.max}`;
}
async function say(text, wait = 700){
  const m = $('msg'); m.textContent = '';
  for(const ch of text){ m.textContent += ch; await sleep(20); }
  await sleep(wait);
}
function show(html, cls = ''){ const mn = $('menu'); mn.innerHTML = html; mn.className = cls; mn.style.display = 'block'; }
function hideMenu(){ const mn = $('menu'); mn.style.display = 'none'; mn.className = ''; }

/* ============ batalha ============ */
function calc(a, d, mv){
  const atk = mv.sp ? a.spa : a.atk, def = mv.sp ? d.spd : d.def;
  let dmg = Math.floor(Math.floor(Math.floor(2 * a.lv / 5 + 2) * mv.p * atk / def) / 50) + 2;
  let eff = 1; d.types.forEach(t => eff *= (CHART[mv.t][t] ?? 1));
  const crit = Math.random() < 1/16;
  if(a.types.includes(mv.t)) dmg *= 1.5;
  if(crit) dmg *= 1.5;
  dmg = eff === 0 ? 0 : Math.max(1, Math.floor(dmg * eff * (0.85 + Math.random() * 0.15)));
  return {dmg, eff, crit};
}
async function attack(att, def, mv, side){
  const isP = side === 'p';
  await say(`${isP ? '' : 'O inimigo '}${att.name} usou ${mv.n}!`, 400);
  if(isP) mv.pp--;
  if(Math.random() * 100 >= mv.acc){ await say(`O ataque de ${att.name} errou!`); return; }
  const {dmg, eff, crit} = calc(att, def, mv);
  await effect(mv.t, side);
  const tgt = $(isP ? 'es' : 'ps');
  tgt.classList.add('hit'); await sleep(1200); tgt.classList.remove('hit');
  def.hp -= dmg;
  drawHP(def, $(isP ? 'eh' : 'ph'), isP ? null : $('pnum'));
  await sleep(900);
  if(crit) await say('Foi um golpe crítico!', 500);
  if(eff === 0) await say(`Não afeta ${def.name}...`, 500);
  else if(eff > 1) await say('É super efetivo!', 500);
  else if(eff < 1) await say('Não foi muito efetivo...', 500);
}
function load(side){
  const isP = side === 'p', m = isP ? G.P : G.E, el = $(isP ? 'ps' : 'es');
  el.classList.remove('faint','hit'); el.style.opacity = ''; el.style.visibility = '';
  if(isP && m.shiny === undefined) m.shiny = Math.random() < SHINY_CHANCE;   // 10% de chance de ser shiny
  const u = spriteURL(m.key, isP, isP && m.shiny); el.innerHTML = u ? `<img src="${u}" alt="${m.name}">` : '';
  $(isP ? 'pn' : 'en').textContent = m.name; $(isP ? 'pl' : 'el').textContent = m.lv;
  drawHP(m, $(isP ? 'ph' : 'eh'), isP ? $('pnum') : null);
  balls();
}
async function shinyMsg(p){ if(p.shiny && !p.shinySeen){ p.shinySeen = true; await say(`Uau! ${p.name} é um POKéMON SHINY!`, 900); } }
function balls(){
  const row = t => t.map(p => `<b class="${p.hp > 0 ? 'ok' : 'ko'}"></b>`).join('');
  $('pballs').innerHTML = row(G.PT); $('eballs').innerHTML = row(G.ET);
}
async function switchIn(side, idx){
  const isP = side === 'p', out = isP ? G.P : G.E;
  if(out.hp > 0){
    await say(isP ? `Volte, ${out.name}!` : `Rival retirou ${out.name}!`, 300);
    $(isP ? 'ps' : 'es').style.opacity = 0; await sleep(500);
  }
  if(isP) G.P = G.PT[idx]; else G.E = G.ET[idx];
  load(side);
  { const el = $(isP ? 'ps' : 'es'); el.classList.add('pop'); setTimeout(() => el.classList.remove('pop'), 500); }
  await say(isP ? `Vai, ${G.P.name}!` : `Rival enviou ${G.E.name}!`, 700);
  if(isP) await shinyMsg(G.P);
}
function end(){ busy = false; show(`<button data-a="again">JOGAR DE NOVO</button>`, 'plain'); $('menu').firstChild.focus(); return true; }
async function faint(side){
  const f = side === 'e' ? G.E : G.P;
  $(side === 'e' ? 'es' : 'ps').classList.add('faint');
  await sleep(700); balls();
  await say(`${side === 'e' ? 'O inimigo ' : ''}${f.name} desmaiou!`, 900);
}
async function afterFaint(side){
  await faint(side);
  if(side === 'e'){
    const nx = G.ET.findIndex(p => p.hp > 0);
    if(nx < 0){ await say('Você venceu a batalha!', 600); return end(); }
    await switchIn('e', nx); return false;
  }
  if(!G.PT.some(p => p.hp > 0)){ await say('Você não tem mais Pokémon... Você desmaiou!', 600); return end(); }
  const idx = await new Promise(r => { pickResolve = r; teamMenu(true); });
  await switchIn('p', idx); return false;
}
async function turn(act){
  busy = true; hideMenu(); hidePick();
  const ok = G.E.moves.filter(m => m.pp > 0);
  const em = ok[Math.floor(Math.random() * ok.length)] || G.E.moves[0];
  if(act.sw !== undefined){
    await switchIn('p', act.sw);
    await attack(G.E, G.P, em, 'e');
    if(G.P.hp <= 0 && await afterFaint('p')) return;
    return mainMenu();
  }
  const pm = act.m < 0 ? struggleMove() : G.P.moves[act.m];
  const order = G.P.spe >= G.E.spe ? [['p',pm],['e',em]] : [['e',em],['p',pm]];
  for(const [side, mv] of order){
    const att = side === 'p' ? G.P : G.E, def = side === 'p' ? G.E : G.P;
    await attack(att, def, mv, side);
    if(def.hp <= 0){ if(await afterFaint(side === 'p' ? 'e' : 'p')) return; break; }
  }
  mainMenu();
}

/* ============ cliques e teclado ============ */
$('pick').addEventListener('click', e => {
  const b = e.target.closest('.card'); if(!b || b.disabled) return;
  if(b.dataset.pick){ picks.push(b.dataset.pick); picks.length < TEAM ? showPick() : start(picks.slice()); return; }
  if(b.dataset.sw !== undefined){
    const i = +b.dataset.sw; hidePick();
    if(pickResolve){ const r = pickResolve; pickResolve = null; hideMenu(); return r(i); }
    if(busy) return; return turn({sw:i});
  }
});
$('menu').addEventListener('click', async e => {
  const b = e.target.closest('button'); if(!b || b.disabled || busy) return;
  if(b.dataset.m !== undefined) return turn({m:+b.dataset.m});
  const a = b.dataset.a;
  if(a === 'fight') moveMenu();
  else if(a === 'mon') teamMenu(false);
  else if(a === 'back'){ hideMenu(); hidePick(); mainMenu(); }
  else if(a === 'again'){ hideMenu(); picks = []; $('screen').classList.remove('battle'); showTitle(); }
  else{ busy = true; hideMenu();
    await say(a === 'run' ? 'Não dá para fugir de uma batalha de treinador!' : 'Você não tem itens na mochila.', 900);
    mainMenu(); }
});
addEventListener('keydown', e => {
  if($('scene').classList.contains('on')){
    if(['Enter',' ','z','Z'].includes(e.key)){ e.preventDefault(); $('sceneBtn').click(); } return; }
  const pick = $('pick').classList.contains('on');
  const bs = [...document.querySelectorAll(pick ? '#pick .card:not(:disabled)' : '#menu button:not(:disabled):not(.chip)')]; if(!bs.length) return;
  const i = bs.indexOf(document.activeElement);
  const st = !pick ? 1 : $('pick').classList.contains('grid') ? 4 : $('pick').classList.contains('team') ? 3 : 1;
  const go = d => { const j = i < 0 ? 0 : Math.min(bs.length - 1, Math.max(0, i + d)); bs[j].focus(); e.preventDefault(); };
  if(e.key === 'ArrowRight') go(1);
  if(e.key === 'ArrowLeft') go(-1);
  if(e.key === 'ArrowDown') go(st);
  if(e.key === 'ArrowUp') go(-st);
  if(e.key === 'x' || e.key === 'Escape') document.querySelector('#menu [data-a=back]')?.click();
});

async function start(team){
  busy = true; hideMenu(); hidePick(); G = newGame(team);
  $('screen').classList.add('battle'); $('bg').style.visibility = 'visible'; load('e'); load('p');
  const tr = showTrainer();
  if(tr) $('ps').style.visibility = 'hidden';
  await say('O treinador rival quer batalhar!', 800);
  await say(`Rival enviou ${G.E.name}!`, 600);
  await say(`Vai, ${G.P.name}!`, 300);
  await shinyMsg(G.P);
  if(tr){ await throwBall(); const ps = $('ps'); ps.style.visibility = ''; ps.classList.add('pop'); setTimeout(() => ps.classList.remove('pop'), 500); }
  await sleep(500);
  mainMenu();
}

/* ============ introdução: copyright → Game Freak → Gengar vs. Nidorino → título ============ */
const SC = { copy:[8,42], gf1:[249,203], gf2:[490,203], gf3:[731,203], gen1:[8,1029], gen2:[8,1205], title:[490,1683] };
function scene(name){
  const s = $('scene'), im = IM.scenes, [x,y] = SC[name];
  if(im && name === 'title'){   // a folha usa laranja (255,90,0) como cor transparente: vira preto
    const u = crop('scenes', x, y, 240, 160, [255,90,0], true);
    s.style.backgroundImage = `url(${u})`; s.style.backgroundSize = '480px 320px'; s.style.backgroundPosition = '0 0';
  } else if(im){ s.style.backgroundImage = `url(${IMG.scenes})`; s.style.backgroundSize = `${im.width*2}px ${im.height*2}px`; s.style.backgroundPosition = `-${x*2}px -${y*2}px`; }
  s.classList.toggle('title', name === 'title'); s.classList.add('on');
}
const fade = async on => { $('fade').classList.toggle('on', on); await sleep(380); };
const wait = ms => new Promise(r => { const t = setTimeout(r, ms); introSkip = () => { clearTimeout(t); r(); }; });
let skipAll = false;
async function intro(){
  $('screen').classList.remove('battle'); hideMenu(); hidePick(); $('msg').textContent = '';
  skipAll = false;
  const steps = [['copy',2200],['gf1',900],['gf2',900],['gf3',1500],['gen1',1900],['gen2',1500]];
  for(const [n, ms] of steps){
    if(skipAll) break;
    scene(n); await fade(false); await wait(ms);
    if(!skipAll && (n === 'copy' || n === 'gf3' || n === 'gen2')) await fade(true);
  }
  await showTitle();
}
async function showTitle(){
  skipAll = true; introSkip = null;
  $('msg').textContent = '';
  scene('title'); await fade(false);
  $('sceneBtn').onclick = async () => {
    $('sceneBtn').onclick = null;
    await fade(true);
    $('scene').classList.remove('on');
    picks = []; showPick(); await fade(false);
  };
  $('sceneBtn').focus();
}
$('sceneBtn').onclick = () => { if(!skipAll){ skipAll = true; introSkip && introSkip(); } };


/* ============ campo em camadas: céu/campo + base do inimigo + base do jogador ============
   O painel de grama de base_de_pokemom.png (240x112, na posição 249,6) vem com as bases já desenhadas.
   Aqui ele é separado em 3 imagens: o fundo sem as bases (cada linha vira uma cor lisa) e cada base
   com transparência. Se o navegador bloquear o canvas, continua valendo o recorte antigo do #bg. */
function buildField(){
  const img = IM.bg; if(!img) return;
  try{
    const PX = 249, PY = 6, W = 240, H = 112;
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const cx = cv.getContext('2d'); cx.drawImage(img, PX, PY, W, H, 0, 0, W, H);
    const src = cx.getImageData(0, 0, W, H).data;
    const px = (x, y) => { const i = (y * W + x) * 4; return [src[i], src[i+1], src[i+2]]; };
    const row = [];                                  // cor lisa de cada linha (lida numa coluna sem base)
    for(let y = 0; y < H; y++) row.push(y < 96 ? px(0, y) : px(W - 1, y));
    // fundo sem bases
    const f = document.createElement('canvas'); f.width = W; f.height = H;
    const fx = f.getContext('2d');
    for(let y = 0; y < H; y++){ fx.fillStyle = `rgb(${row[y]})`; fx.fillRect(0, y, W, 1); }
    // recorta uma base: só os pixels diferentes da cor do fundo da linha ficam opacos
    const cut = (x0, y0, w, h) => {
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const k = c.getContext('2d'), d = k.createImageData(w, h);
      for(let y = 0; y < h; y++) for(let x = 0; x < w; x++){
        const p = px(x0 + x, y0 + y), r = row[y0 + y], i = (y * w + x) * 4;
        const same = p[0] === r[0] && p[1] === r[1] && p[2] === r[2];
        d.data[i] = p[0]; d.data[i+1] = p[1]; d.data[i+2] = p[2]; d.data[i+3] = same ? 0 : 255;
      }
      k.putImageData(d, 0, 0); return c.toDataURL();
    };
    const base = cut(112, 46, 128, 34);              // plataforma de grama do inimigo
    const bg = $('bg');
    bg.style.backgroundImage = `url(${f.toDataURL()})`;
    bg.style.backgroundPosition = '0 0'; bg.style.backgroundSize = '480px 224px';
    for(const id of ['be', 'bp']){ const e = $(id); e.style.backgroundImage = `url(${base})`; e.classList.add('on'); }
  }catch(e){ /* sem canvas: mantém o fundo antigo */ }
}

/* ============ início ============ */
(async () => {
  await loadAll();
  buildField();
  if(IM.ui){ // moldura dos cartões = caixa branca/lilás de battle_menu.png (região sem texto)
    const u = crop('ui', 297, 4, 162, 48, [255,255,255], false);
    // crop() apaga o fundo branco externo; assim a moldura fica transparente fora das bordas
    if(u) document.documentElement.style.setProperty('--card', `url(${u})`);
  }
  if(missing.length){
    const d = document.createElement('div');
    d.style.cssText = 'position:absolute;left:0;right:0;top:0;z-index:99;background:#a00;color:#fff;font-size:8px;line-height:12px;padding:6px';
    d.textContent = 'Arquivo(s) não encontrado(s): ' + missing.join(', ');
    $('screen').appendChild(d);
  }
  intro();
})();
